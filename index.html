<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATELCAB · Gestão de PTs</title>
<meta name="theme-color" content="#1b2559">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M58 4 22 56h24l-8 40 40-56H54z' fill='%23c62828'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--navy:#1b2559;--navy2:#2a3577;--red:#c62828;--bg:#f3f5f9;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
--blue:#2563eb;--amber:#d97706;--purple:#7c3aed;--green:#16a34a;--teal:#0d9488;--gray:#6b7280;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
a{color:var(--blue)}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .wm{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:18px;letter-spacing:.5px}
.brand small{display:block;font-size:11px;opacity:.75;font-family:system-ui,sans-serif;letter-spacing:0;font-weight:400}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{color:#cbd5e1;text-decoration:none;padding:8px 12px;border-radius:8px;white-space:nowrap;font-size:14px}
nav a.on,nav a:hover{background:var(--navy2);color:#fff}
.who{font-size:13px;opacity:.9;white-space:nowrap;cursor:pointer}
main{max-width:1100px;margin:auto;padding:16px}
h1{font-size:21px;margin:4px 0 16px;color:var(--navy)}h2{font-size:17px;margin:0 0 12px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-left:4px solid var(--c,var(--navy));text-decoration:none;color:inherit}
.stat .n{font-size:28px;font-weight:700}.stat .l{color:var(--muted);font-size:13px}
.progress{height:14px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress div{height:100%;background:var(--green)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}td.num,th.num{text-align:center}
.scroll{overflow-x:auto}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#ecfeff;color:var(--teal);font-weight:600;margin-left:6px}
.late{color:var(--red);font-weight:600;font-size:12px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
label.chk{display:flex;align-items:center;gap:8px;font-weight:500}label.chk input{width:auto}
input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:150px}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
button:disabled{opacity:.5;cursor:wait}
.btn-main{background:var(--red)}.btn-green{background:var(--green)}.btn-red{background:#b91c1c}.btn-teal{background:var(--teal)}
.btn-light{background:#fff;color:var(--navy);border:1px solid #d1d5db}.btn-sm{padding:6px 11px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.list .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.list .item:hover{background:#f9fafb}.list .item:last-child{border-bottom:0}
.item .t{font-weight:600}.item .s{color:var(--muted);font-size:13px;margin-top:2px}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.ev{position:relative;margin-bottom:16px}.ev:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--gray))}
.ev .h{font-size:13px;color:var(--muted)}.ev .h b{color:var(--text)}
.ev .c{background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:6px;white-space:pre-wrap}
.muted{color:var(--muted)}.small{font-size:13px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--navy),#0e1438)}
.login{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:380px}
.login .logo{display:flex;justify-content:center;margin-bottom:6px}
.login .wm{font-family:Georgia,serif;font-weight:700;font-size:24px;color:var(--navy);text-align:center}
.login .sub{text-align:center;color:#4f6bd8;font-size:13px;margin-bottom:8px}
.sep{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;display:none;z-index:99;max-width:90%}
#toast.err{background:var(--red)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}
@media (max-width:640px){.bar{flex-wrap:wrap}nav{order:3;flex-basis:100%}.who{margin-left:auto}.hide-m{display:none}.brand small{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
// ================= Marca ATELCAB =================
function logo(size = 40, light = false) {
  const blue = light ? '#ffffff' : '#1b2559';
  const arc = y => `<path d="M30 ${y}h-14a7 7 0 0 0 0 14h14" fill="none" stroke="${blue}" stroke-width="3.2" stroke-linecap="round"/>
                    <path d="M30 ${y}h14a7 7 0 0 1 0 14h-14" fill="none" stroke="${blue}" stroke-width="3.2" stroke-linecap="round"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 80 64" aria-label="ATELCAB">
    <path d="M30 6v52" stroke="${blue}" stroke-width="3.2"/>${arc(6)}${arc(22)}${arc(38)}
    <path d="M68 4 56 30h9l-6 26 17-32h-9l7-20z" fill="#c62828"/></svg>`;
}
const EMPRESA = 'ATELCAB, LDA.', SLOGAN = 'Construções e Projectos Eléctricos';

// ================= Utilitários =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d.length === 10 ? d + 'T00:00:00' : d).toLocaleDateString('pt-PT') : '—';
const fmtDT = d => d ? new Date(d).toLocaleString('pt-PT', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const today = () => new Date().toISOString().slice(0, 10);
const safeName = n => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_');
function toast(msg, err = false) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 6000 : 3000);
}
const friendly = e => { const m = e?.message || String(e); return /Invalid login/i.test(m) ? 'Email ou palavra-passe incorrectos.' : m; };

const STATUS = {
  pendente:{l:'Por atribuir',c:'var(--gray)'}, atribuido:{l:'Atribuído',c:'var(--blue)'},
  em_progresso:{l:'Em progresso',c:'var(--amber)'}, submetido:{l:'Aguarda revisão',c:'var(--purple)'},
  devolvido:{l:'Devolvido',c:'var(--red)'}, aprovado:{l:'Aprovado · por enviar',c:'var(--green)'},
  enviado_cliente:{l:'Enviado ao cliente',c:'var(--teal)'}, aceite_cliente:{l:'Aceite pelo cliente',c:'var(--green)'},
  alteracoes_cliente:{l:'Cliente pediu alterações',c:'var(--red)'},
};
// O que o cliente vê
const CSTATUS = { enviado_cliente:{l:'Para rever',c:'var(--teal)'}, aceite_cliente:{l:'Aceite',c:'var(--green)'},
  alteracoes_cliente:{l:'Alterações pedidas',c:'var(--red)'} };
const DONE = ['aprovado','enviado_cliente','aceite_cliente'];
const badge = s => { const x = (isCliente() && (CSTATUS[s] || {l:'Em correcção',c:'var(--amber)'})) || STATUS[s] || {l:s,c:'var(--gray)'};
  return `<span class="badge" style="--c:${x.c}">${x.l}</span>`; };
const isLate = t => t.due_date && !DONE.includes(t.status) && t.due_date < today();
const EVENTS = { criado:'criou a tarefa', atribuido:'atribuiu a tarefa', iniciado:'começou a trabalhar', submetido:'submeteu o trabalho',
  aprovado:'aprovou ✔', devolvido:'devolveu para correcção', comentario:'comentou', enviado_cliente:'enviou ao cliente 📨',
  cliente_aceite:'ACEITOU o drawing ✔', cliente_alteracoes:'pediu alterações' };
const EVCOLOR = { criado:'var(--gray)', atribuido:'var(--blue)', iniciado:'var(--amber)', submetido:'var(--purple)', aprovado:'var(--green)',
  devolvido:'var(--red)', comentario:'var(--navy)', enviado_cliente:'var(--teal)', cliente_aceite:'var(--green)', cliente_alteracoes:'var(--red)' };

// ================= Estado =================
let sb, me = null, people = [];
const isAdmin = () => me?.role === 'admin', isCliente = () => me?.role === 'cliente';
const nameOf = id => { const p = people.find(x => x.id === id); return p ? (p.full_name || p.email) : '—'; };
const techs = () => people.filter(p => p.role === 'tecnico').concat(people.filter(p => p.role === 'admin'));
const ROLE = { admin:'Administrador', tecnico:'Técnico', cliente:'Cliente' };

// ================= Arranque =================
async function boot() {
  if (typeof SUPABASE_URL === 'undefined' || !/^https:\/\//.test(SUPABASE_URL) || !SUPABASE_KEY || SUPABASE_KEY.includes('COLE')) {
    $('#root').innerHTML = `<div class="center"><div class="login"><div class="logo">${logo(70)}</div><div class="wm">ATELCAB</div>
      <p class="muted">Falta configurar: crie o ficheiro <b>config.js</b> com o Project URL e a chave do Supabase.</p></div></div>`;
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange(ev => {
    if (ev === 'PASSWORD_RECOVERY') renderNewPassword();
    if (ev === 'SIGNED_OUT') { me = null; renderLogin(); }
  });
  const { data } = await sb.auth.getSession();
  if (location.hash.includes('type=recovery')) return;
  if (data.session) await enter(); else renderLogin();
}
async function enter() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return renderLogin();
  await loadPeople();
  me = people.find(p => p.id === user.id);
  if (!me) { toast('Perfil não encontrado. Contacte a ATELCAB.', true); await sb.auth.signOut(); return; }
  window.onhashchange = route;
  if (!location.hash || location.hash === '#' || location.hash.startsWith('#access_token')) location.hash = '#/painel'; else route();
}
async function loadPeople() {
  const { data, error } = await sb.from('profiles').select('*').order('full_name');
  if (error) throw error; people = data;
}
function loginBox(inner) {
  return `<div class="center"><form class="login" id="f"><div class="logo">${logo(76)}</div>
    <div class="wm">${EMPRESA}</div><div class="sub">${SLOGAN}</div>${inner}</form></div>`;
}
function renderLogin() {
  window.onhashchange = null;
  $('#root').innerHTML = loginBox(`<p class="muted small" style="text-align:center;margin:0">Plataforma de Gestão de Projectos</p>
    <label>Email</label><input type="email" name="email" required autocomplete="email">
    <label>Palavra-passe</label><input type="password" name="pw" required autocomplete="current-password">
    <div class="actions"><button class="btn-main" style="width:100%">Entrar</button></div>
    <p class="small" style="text-align:center"><a href="#" id="forgot">Esqueci a palavra-passe</a></p>`);
  $('#f').onsubmit = async e => {
    e.preventDefault(); const b = e.submitter; b.disabled = true; const f = new FormData(e.target);
    const { error } = await sb.auth.signInWithPassword({ email: f.get('email').trim(), password: f.get('pw') });
    b.disabled = false; if (error) return toast(friendly(error), true);
    location.hash = '#/painel'; enter();
  };
  $('#forgot').onclick = async e => {
    e.preventDefault(); const email = $('#f [name=email]').value.trim();
    if (!email) return toast('Escreva primeiro o seu email.', true);
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) return toast(friendly(error), true);
    toast('Enviámos um email com o link para definir nova palavra-passe.');
  };
}
function renderNewPassword() {
  $('#root').innerHTML = loginBox(`<h2 style="text-align:center">Nova palavra-passe</h2>
    <input type="password" name="pw" minlength="6" placeholder="Mínimo 6 caracteres" required>
    <div class="actions"><button class="btn-main" style="width:100%">Guardar</button></div>`);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: new FormData(e.target).get('pw') });
    if (error) return toast(friendly(error), true);
    toast('Palavra-passe alterada.'); history.replaceState(null, '', location.pathname + '#/painel'); enter();
  };
}

// ================= Layout =================
function shell(active, html) {
  const links = [['painel','📊 Painel'], ['tarefas', isCliente() ? '📄 Drawings' : isAdmin() ? '📋 Tarefas' : '📋 As minhas tarefas']];
  if (isAdmin()) links.push(['nova','➕ Nova tarefa'], ['equipa','👥 Equipa']);
  $('#root').innerHTML = `<header><div class="bar">
    <a class="brand" href="#/painel" style="color:#fff;text-decoration:none">${logo(34, true)}<div><span class="wm">ATELCAB</span><small>Gestão de PTs</small></div></a>
    <nav>${links.map(([k,l]) => `<a href="#/${k}" class="${active===k?'on':''}">${l}</a>`).join('')}</nav>
    <div class="who" onclick="location.hash='#/conta'">👤 ${esc(me.full_name || me.email)}${isAdmin() ? ' · admin' : isCliente() ? ' · cliente' : ''}</div>
  </div></header><main>${html}</main>`;
}
async function route() {
  const [, page, id] = location.hash.split('?')[0].split('/');
  try {
    if (page === 'tarefa' && id) return await viewTask(+id);
    if (page === 'tarefas') return await viewTasks();
    if (page === 'nova' && isAdmin()) return viewNew();
    if (page === 'equipa' && isAdmin()) return await viewTeam();
    if (page === 'conta') return viewAccount();
    return await viewDashboard();
  } catch (e) { console.error(e); toast(friendly(e), true); }
}
async function fetchTasks() {
  const { data, error } = await sb.from('tasks')
    .select('id,code,title,status,assigned_to,due_date,created_at,updated_at,approved_at,sent_to_client_at')
    .order('updated_at', { ascending: false });
  if (error) throw error; return data;
}
const stat = (n, l, col, s) => `<a class="stat" style="--c:${col}" href="#/tarefas${s ? '?s=' + s : ''}"><div class="n">${n}</div><div class="l">${l}</div></a>`;
function itemHTML(t) {
  return `<a class="item" href="#/tarefa/${t.id}"><div><div class="t">${esc(t.code)}${t.title ? ' — ' + esc(t.title) : ''}</div>
    <div class="s">${!isCliente() && t.assigned_to ? '👤 ' + esc(nameOf(t.assigned_to)) + ' · ' : ''}${!isCliente() && t.due_date ? 'Prazo ' + fmtDate(t.due_date) + ' · ' : ''}${isCliente() ? 'Enviado ' + fmtDT(t.sent_to_client_at) : 'act. ' + fmtDT(t.updated_at)}
    ${!isCliente() && isLate(t) ? ' <span class="late">· ATRASADO</span>' : ''}</div></div>${badge(t.status)}</a>`;
}
const section = (title, list) => list.length ? `<div class="card"><h2>${title}</h2><div class="list">${list.map(itemHTML).join('')}</div></div>` : '';

// ================= Painel / relatórios =================
async function viewDashboard() {
  shell('painel', '<p class="muted">A carregar…</p>');
  const tasks = await fetchTasks();
  const c = s => tasks.filter(t => s.includes(t.status)).length;

  if (isCliente()) {
    shell('painel', `<h1>Bem-vindo, ${esc(me.full_name || '')}</h1>
      <div class="grid">${stat(c(['enviado_cliente']), 'Para rever', 'var(--teal)', 'enviado_cliente')}
        ${stat(c(['aceite_cliente']), 'Aceites', 'var(--green)', 'aceite_cliente')}
        ${stat(c(['alteracoes_cliente']), 'Alterações pedidas', 'var(--red)', 'alteracoes_cliente')}
        ${stat(tasks.filter(t => !CSTATUS[t.status]).length, 'Em correcção na ATELCAB', 'var(--amber)')}</div>
      ${section('📄 Drawings à espera da sua revisão', tasks.filter(t => t.status === 'enviado_cliente'))}
      <p class="small muted">${EMPRESA} — ${SLOGAN}</p>`);
    return;
  }

  const total = tasks.length, done = c(DONE), pct = total ? Math.round(done / total * 100) : 0;
  const late = tasks.filter(isLate).length;
  const doneWeek = tasks.filter(t => DONE.includes(t.status) && t.approved_at && new Date(t.approved_at) > Date.now() - 7 * 864e5).length;

  let perTech = '';
  if (isAdmin()) {
    const rows = techs().map(p => {
      const mine = tasks.filter(t => t.assigned_to === p.id), k = s => mine.filter(t => s.includes(t.status)).length;
      return { p, total: mine.length, curso: k(['atribuido','em_progresso']), rev: k(['submetido']), dev: k(['devolvido','alteracoes_cliente']), ok: k(DONE), late: mine.filter(isLate).length };
    }).filter(r => r.total || r.p.role === 'tecnico');
    perTech = `<div class="card"><h2>Por técnico</h2><div class="scroll"><table>
      <tr><th>Técnico</th><th class="num">Em curso</th><th class="num">Aguarda revisão</th><th class="num">Devolvidos</th><th class="num">Feitos</th><th class="num">Atrasados</th><th class="num">Total</th></tr>
      ${rows.map(r => `<tr><td><a href="#/tarefas?u=${r.p.id}">${esc(r.p.full_name || r.p.email)}</a></td><td class="num">${r.curso}</td><td class="num">${r.rev}</td>
        <td class="num">${r.dev}</td><td class="num"><b style="color:var(--green)">${r.ok}</b></td><td class="num">${r.late ? `<span class="late">${r.late}</span>` : 0}</td><td class="num">${r.total}</td></tr>`).join('')}
      </table></div></div>`;
  }

  shell('painel', `
    <div class="row" style="margin-bottom:12px"><h1 style="margin:0">${isAdmin() ? 'Painel do projecto' : 'O meu painel'}</h1>
      <div style="flex:0"><button class="btn-light btn-sm" onclick="exportCSV()">⬇️ Exportar Excel</button></div></div>
    <div class="card">
      <div class="row" style="align-items:center"><div><b style="font-size:22px">${done}</b> de <b>${total}</b> PTs feitos (aprovados)</div>
        <div style="text-align:right;flex:0;min-width:60px;font-size:22px;font-weight:700;color:var(--green)">${pct}%</div></div>
      <div class="progress" style="margin-top:10px"><div style="width:${pct}%"></div></div>
      <p class="small muted" style="margin:8px 0 0">Aprovados nos últimos 7 dias: <b>${doneWeek}</b></p>
    </div>
    <div class="grid">
      ${stat(done, '✔ Feitos (aprovados)', 'var(--green)')}
      ${stat(c(['atribuido','em_progresso']), 'Em progresso', 'var(--amber)', 'em_progresso')}
      ${stat(c(['submetido']), 'Aguardam revisão', 'var(--purple)', 'submetido')}
      ${stat(c(['devolvido']), 'Devolvidos', 'var(--red)', 'devolvido')}
      ${isAdmin() ? stat(c(['pendente']), 'Por atribuir', 'var(--gray)', 'pendente') : ''}
      ${stat(late, 'Atrasados', 'var(--red)', 'late')}
    </div>
    ${isAdmin() ? `<h2>Cliente</h2><div class="grid">
      ${stat(c(['aprovado']), 'Aprovados · por enviar', 'var(--green)', 'aprovado')}
      ${stat(c(['enviado_cliente']), 'Com o cliente', 'var(--teal)', 'enviado_cliente')}
      ${stat(c(['aceite_cliente']), 'Aceites pelo cliente', 'var(--green)', 'aceite_cliente')}
      ${stat(c(['alteracoes_cliente']), 'Alterações do cliente', 'var(--red)', 'alteracoes_cliente')}</div>` : ''}
    ${isAdmin() ? section('🟣 Aguardam a sua revisão', tasks.filter(t => t.status === 'submetido'))
      + section('🔴 O cliente pediu alterações', tasks.filter(t => t.status === 'alteracoes_cliente'))
      + section('📨 Aprovados — por enviar ao cliente', tasks.filter(t => t.status === 'aprovado'))
      : section('🔴 Devolvidos para corrigir', tasks.filter(t => t.status === 'devolvido'))
      + section('📌 Para fazer', tasks.filter(t => ['atribuido','em_progresso'].includes(t.status)))}
    ${perTech}`);
}
async function exportCSV() {
  const tasks = await fetchTasks();
  const head = ['Código','Título','Estado','Técnico','Prazo','Atrasado','Criado em','Última actualização','Aprovado em','Enviado ao cliente'];
  const rows = tasks.map(t => [t.code, t.title, STATUS[t.status].l, t.assigned_to ? nameOf(t.assigned_to) : '', t.due_date ? fmtDate(t.due_date) : '',
    isLate(t) ? 'Sim' : '', fmtDT(t.created_at), fmtDT(t.updated_at), t.approved_at ? fmtDT(t.approved_at) : '', t.sent_to_client_at ? fmtDT(t.sent_to_client_at) : '']);
  const csv = '﻿' + [head, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `ATELCAB-relatorio-PTs-${today()}.csv`; a.click();
}

// ================= Lista =================
async function viewTasks() {
  shell('tarefas', '<p class="muted">A carregar…</p>');
  const tasks = await fetchTasks();
  const q = new URLSearchParams(location.hash.split('?')[1] || '');
  const statuses = isCliente() ? CSTATUS : STATUS;
  shell('tarefas', `<h1>${isCliente() ? 'Drawings' : isAdmin() ? 'Todas as tarefas' : 'As minhas tarefas'}</h1>
    <div class="card"><div class="row">
      <div><label>Pesquisar</label><input id="fq" placeholder="ex.: PT 12"></div>
      <div><label>Estado</label><select id="fs"><option value="">Todos</option>
        ${Object.entries(statuses).map(([k,v]) => `<option value="${k}">${v.l}</option>`).join('')}
        ${isCliente() ? '' : '<option value="late">⚠ Atrasados</option>'}</select></div>
      ${isAdmin() ? `<div><label>Técnico</label><select id="fu"><option value="">Todos</option><option value="none">Sem técnico</option>
        ${techs().map(p => `<option value="${p.id}">${esc(p.full_name || p.email)}</option>`).join('')}</select></div>` : ''}
    </div></div><div class="card" style="padding:0"><div class="list" id="lst"></div></div>`);
  if (q.get('u') && $('#fu')) $('#fu').value = q.get('u');
  if (q.get('s')) $('#fs').value = q.get('s');
  const draw = () => {
    const txt = $('#fq').value.toLowerCase(), s = $('#fs').value, u = $('#fu')?.value || '';
    const list = tasks.filter(t => (!txt || (t.code + ' ' + (t.title || '')).toLowerCase().includes(txt))
      && (!s || (s === 'late' ? isLate(t) : s === 'em_progresso' ? ['atribuido','em_progresso'].includes(t.status) : t.status === s))
      && (!u || (u === 'none' ? !t.assigned_to : t.assigned_to === u)));
    $('#lst').innerHTML = list.length ? list.map(itemHTML).join('') : '<p class="muted" style="padding:16px">Nada para mostrar.</p>';
  };
  ['#fq','#fs','#fu'].forEach(s => $(s) && ($(s).oninput = draw));
  draw();
}

// ================= Ficheiros =================
async function openFile(path) {
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from('drawings').createSignedUrl(path, 3600);
  if (error) { w?.close(); return toast(friendly(error), true); }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}
async function uploadPDF(file, folder) {
  if (file.type && file.type !== 'application/pdf') throw new Error(`"${file.name}" não é um PDF.`);
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${safeName(file.name)}`;
  const { error } = await sb.storage.from('drawings').upload(path, file, { contentType: 'application/pdf' });
  if (error) throw error; return path;
}
async function maybeUpload(form, folder) {
  const file = new FormData(form).get('file');
  if (!file || !file.size) return [null, null];
  toast('A carregar PDF…'); return [await uploadPDF(file, folder), file.name];
}
const fileBtn = (path, label) => path ? `<button class="btn-light" onclick="openFile('${esc(path)}')">📄 ${label}</button>` : '';

// ================= Detalhe =================
async function viewTask(id) {
  shell('tarefas', '<p class="muted">A carregar…</p>');
  const [{ data: t, error }, { data: acts }] = await Promise.all([
    sb.from('tasks').select('*').eq('id', id).maybeSingle(),
    sb.from('activity').select('*').eq('task_id', id).order('created_at')]);
  if (error) throw error;
  if (!t) return shell('tarefas', '<div class="card">Não encontrado ou sem acesso.</div>');
  const mine = t.assigned_to === me.id && !isCliente();
  const lastSub = [...(acts || [])].reverse().find(a => a.kind === 'submetido' && a.file_path);

  let actions = '', forms = '';
  if (isCliente()) {
    actions = fileBtn(t.final_path, 'Descarregar drawing');
    if (t.status === 'enviado_cliente') {
      actions += `<button class="btn-green" onclick="clientAccept(${id})">✔ Aceitar</button>
        <button class="btn-main" onclick="$('#altbox').style.display='block'">✏ Pedir alterações</button>`;
      forms = `<form id="altbox" class="sep" style="display:none"><label>Que alterações pretende? *</label><textarea name="c" required></textarea>
        <label>PDF com marcações (opcional)</label><input type="file" name="file" accept="application/pdf">
        <div class="actions"><button class="btn-main">Enviar pedido de alterações</button></div></form>`;
    }
  } else {
    actions = fileBtn(t.drawing_path, 'Drawing original') + fileBtn(lastSub?.file_path, 'Última versão submetida')
      + (t.final_path ? fileBtn(t.final_path, 'Versão enviada ao cliente') : '');
    if (mine && ['atribuido','devolvido'].includes(t.status))
      actions += `<button class="btn-main" onclick="act('start_task',{p_task:${id}})">▶ Começar a trabalhar</button>`;
    if (mine && ['atribuido','em_progresso','devolvido'].includes(t.status)) {
      actions += `<button onclick="$('#subbox').style.display='block';this.remove()">📤 Submeter trabalho</button>`;
      forms += `<form id="subbox" class="sep" style="display:none"><label>PDF revisto (opcional)</label><input type="file" name="file" accept="application/pdf">
        <label>Alterações feitas *</label><textarea name="c" required placeholder="Descreva as mudanças que fez…"></textarea>
        <div class="actions"><button class="btn-main">Enviar para revisão</button></div></form>`;
    }
    if (isAdmin() && t.status === 'submetido') {
      actions += `<button class="btn-green" onclick="approve(${id})">✔ Aprovar</button>
        <button class="btn-red" onclick="$('#retbox').style.display='block'">↩ Devolver</button>`;
      forms += `<form id="retbox" class="sep" style="display:none"><label>O que precisa de ser corrigido? *</label><textarea name="c" required></textarea>
        <div class="actions"><button class="btn-red">Devolver ao técnico</button></div></form>`;
    }
    if (isAdmin() && t.status === 'aprovado') {
      actions += `<button class="btn-teal" onclick="$('#sendbox').style.display='block';this.remove()">📨 Enviar ao cliente</button>`;
      forms += `<form id="sendbox" class="sep" style="display:none">
        <p class="small muted">Será enviado: <b>${esc(lastSub?.file_name || t.drawing_name || '—')}</b>. Para enviar outro ficheiro, anexe abaixo.</p>
        <label>Outro PDF (opcional)</label><input type="file" name="file" accept="application/pdf">
        <label>Mensagem para o cliente (opcional)</label><textarea name="c" placeholder="Segue o drawing para sua apreciação…"></textarea>
        <div class="actions"><button class="btn-teal">📨 Enviar ao cliente</button></div></form>`;
    }
  }

  const tl = (acts || []).map(a => `<div class="ev" style="--c:${EVCOLOR[a.kind] || 'var(--gray)'}">
      <div class="h"><b>${esc(nameOf(a.user_id))}</b> ${EVENTS[a.kind] || a.kind} · ${fmtDT(a.created_at)}${!isCliente() && a.visible_cliente ? '<span class="tag">👁 cliente</span>' : ''}</div>
      ${a.comment ? `<div class="c">${esc(a.comment)}</div>` : ''}
      ${a.file_path ? `<div style="margin-top:6px"><a href="#" onclick="openFile('${esc(a.file_path)}');return false">📎 ${esc(a.file_name || 'ficheiro')}</a></div>` : ''}
    </div>`).join('') || '<p class="muted">Sem histórico.</p>';

  shell('tarefas', `<p class="small"><a href="#/tarefas">← Voltar</a></p>
    <div class="card">
      <div class="row" style="align-items:center"><h1 style="margin:0">${esc(t.code)}${t.title ? ' — ' + esc(t.title) : ''}</h1><div style="flex:0">${badge(t.status)}</div></div>
      ${!isCliente() && isLate(t) ? '<p class="late">⚠ Prazo ultrapassado</p>' : ''}
      ${isCliente() ? `<p class="small muted">Enviado pela ${EMPRESA} em ${fmtDT(t.sent_to_client_at)}</p>` : `<div class="kv" style="margin-top:14px">
        <div>Técnico</div><div>${t.assigned_to ? esc(nameOf(t.assigned_to)) : '<i class="muted">por atribuir</i>'}</div>
        <div>Prazo</div><div>${fmtDate(t.due_date)}</div>
        <div>Criado</div><div>${fmtDT(t.created_at)} por ${esc(nameOf(t.created_by))}</div>
        ${t.approved_at ? `<div>Aprovado</div><div>${fmtDT(t.approved_at)} por ${esc(nameOf(t.approved_by))}</div>` : ''}
        ${t.sent_to_client_at ? `<div>Ao cliente</div><div>${fmtDT(t.sent_to_client_at)}</div>` : ''}</div>
        ${t.description ? `<p style="white-space:pre-wrap;background:#f9fafb;padding:10px;border-radius:8px">${esc(t.description)}</p>` : ''}`}
      <div class="actions">${actions}</div>${forms}
    </div>
    ${isAdmin() && !DONE.includes(t.status) ? `<div class="card"><h2>${t.status === 'alteracoes_cliente' ? 'Atribuir correcções do cliente' : 'Atribuir'}</h2><div class="row">
      <div><select id="asg"><option value="">— escolher técnico —</option>
        ${techs().map(p => `<option value="${p.id}" ${p.id === t.assigned_to ? 'selected' : ''}>${esc(p.full_name || p.email)}${p.role==='admin'?' (admin)':''}</option>`).join('')}</select></div>
      <div style="flex:0"><button onclick="assign(${id})">${t.assigned_to ? 'Reatribuir' : 'Atribuir'} e notificar</button></div></div></div>` : ''}
    <div class="card"><h2>${isCliente() ? 'Comentários' : 'Histórico e comentários'}</h2><div class="timeline">${tl}</div>
      <form id="cbox"><label>Novo comentário</label><textarea name="c" required style="min-height:60px"></textarea>
        ${isAdmin() && t.sent_to_client_at ? '<label class="chk"><input type="checkbox" name="cli"> Enviar também ao cliente (ele vê e recebe email)</label>' : ''}
        <div class="actions"><button class="btn-light">💬 Comentar</button></div></form></div>
    ${isAdmin() ? `<div class="card"><h2>Editar tarefa</h2><form id="edit">
      <div class="row"><div><label>Código</label><input name="code" value="${esc(t.code)}" required></div>
        <div><label>Título</label><input name="title" value="${esc(t.title || '')}"></div>
        <div><label>Prazo</label><input type="date" name="due" value="${t.due_date || ''}"></div></div>
      <label>Descrição (interna)</label><textarea name="desc">${esc(t.description || '')}</textarea>
      <div class="actions"><button class="btn-light">Guardar</button>
        <button type="button" class="btn-red btn-sm" style="margin-left:auto" onclick="delTask(${id})">🗑 Eliminar</button></div></form></div>` : ''}`);

  const on = (sel, fn) => { const f = $(sel); if (f) f.onsubmit = async e => {
    e.preventDefault(); const b = e.submitter; b.disabled = true;
    try { await fn(e.target, new FormData(e.target)); route(); } catch (err) { toast(friendly(err), true); b.disabled = false; } }; };
  on('#subbox', async (f, d) => { const [p, n] = await maybeUpload(f, `submissoes/${id}`);
    await rpc('submit_task', { p_task: id, p_comment: d.get('c'), p_file_path: p, p_file_name: n }); toast('Submetido! Os administradores foram notificados.'); });
  on('#retbox', async (f, d) => { await rpc('return_task', { p_task: id, p_comment: d.get('c') }); toast('Devolvido ao técnico.'); });
  on('#sendbox', async (f, d) => { const [p, n] = await maybeUpload(f, `cliente-envios/${id}`);
    await rpc('send_to_client', { p_task: id, p_message: d.get('c'), p_file_path: p, p_file_name: n }); toast('📨 Enviado ao cliente.'); });
  on('#altbox', async (f, d) => { const [p, n] = await maybeUpload(f, `cliente/${id}`);
    await rpc('client_respond', { p_task: id, p_accept: false, p_comment: d.get('c'), p_file_path: p, p_file_name: n }); toast('Pedido enviado à ATELCAB.'); });
  on('#cbox', async (f, d) => { await rpc('add_comment', { p_task: id, p_comment: d.get('c'), p_to_client: !!d.get('cli') }); });
  on('#edit', async (f, d) => {
    const { error } = await sb.from('tasks').update({ code: d.get('code').trim(), title: d.get('title').trim() || null,
      due_date: d.get('due') || null, description: d.get('desc').trim() || null, updated_at: new Date().toISOString() }).eq('id', id);
    if (error) throw error; toast('Guardado.'); });
}
async function rpc(fn, args) { const { error } = await sb.rpc(fn, args); if (error) throw error; }
async function act(fn, args) { try { await rpc(fn, args); route(); } catch (e) { toast(friendly(e), true); } }
async function approve(id) {
  const c = prompt('Aprovar este PT. Comentário (opcional):', ''); if (c === null) return;
  try { await rpc('approve_task', { p_task: id, p_comment: c }); toast('✔ Aprovado e contabilizado.'); route(); } catch (e) { toast(friendly(e), true); }
}
async function clientAccept(id) {
  const c = prompt('Aceitar este drawing. Comentário (opcional):', ''); if (c === null) return;
  try { await rpc('client_respond', { p_task: id, p_accept: true, p_comment: c, p_file_path: null, p_file_name: null }); toast('✔ Obrigado! Drawing aceite.'); route(); }
  catch (e) { toast(friendly(e), true); }
}
async function assign(id) {
  const u = $('#asg').value; if (!u) return toast('Escolha um técnico.', true);
  try { await rpc('assign_task', { p_task: id, p_user: u }); toast('Atribuído. O técnico recebeu um email.'); route(); } catch (e) { toast(friendly(e), true); }
}
async function delTask(id) {
  if (!confirm('Eliminar esta tarefa e todo o histórico? Não pode ser desfeito.')) return;
  const { error } = await sb.from('tasks').delete().eq('id', id);
  if (error) return toast(friendly(error), true);
  toast('Tarefa eliminada.'); location.hash = '#/tarefas';
}

// ================= Nova tarefa =================
function viewNew() {
  shell('nova', `<h1>Nova tarefa</h1><form class="card" id="nf">
    <label>Drawing(s) PDF do desenhador</label><input type="file" name="files" accept="application/pdf" multiple>
    <p class="small muted" style="margin:6px 0 0">Pode escolher vários PDFs: é criada uma tarefa por ficheiro (código = nome do ficheiro).</p>
    <div class="row"><div><label>Código do PT</label><input name="code" placeholder="ex.: PT 12 (vazio = nome do ficheiro)"></div>
      <div><label>Título</label><input name="title" placeholder="ex.: Revisão do esquema unifilar"></div></div>
    <label>Instruções para o técnico</label><textarea name="desc" placeholder="O que deve ser feito…"></textarea>
    <div class="row"><div><label>Atribuir a</label><select name="who"><option value="">— atribuir depois —</option>
        ${techs().map(p => `<option value="${p.id}">${esc(p.full_name || p.email)}${p.role==='admin'?' (admin)':''}</option>`).join('')}</select></div>
      <div><label>Prazo</label><input type="date" name="due"></div></div>
    <div class="actions"><button class="btn-main">Criar tarefa(s)</button></div><p class="small muted" id="prog"></p></form>`);
  $('#nf').onsubmit = async e => {
    e.preventDefault(); const b = e.submitter; b.disabled = true; const f = new FormData(e.target);
    const files = f.getAll('files').filter(x => x && x.size), code = f.get('code').trim();
    if (!files.length && !code) { b.disabled = false; return toast('Indique o código do PT ou escolha um PDF.', true); }
    const base = { p_title: f.get('title').trim(), p_description: f.get('desc').trim(), p_due: f.get('due') || null, p_assign: f.get('who') || null };
    try {
      let lastId;
      if (!files.length) { const { data, error } = await sb.rpc('create_task', { ...base, p_code: code, p_drawing_path: null, p_drawing_name: null }); if (error) throw error; lastId = data; }
      for (let i = 0; i < files.length; i++) {
        $('#prog').textContent = `A carregar ${i + 1} de ${files.length}: ${files[i].name}…`;
        const path = await uploadPDF(files[i], 'originais');
        const c = files.length === 1 && code ? code : files[i].name.replace(/\.pdf$/i, '');
        const { data, error } = await sb.rpc('create_task', { ...base, p_code: c, p_drawing_path: path, p_drawing_name: files[i].name });
        if (error) throw error; lastId = data;
      }
      const n = Math.max(files.length, 1);
      toast(`${n} tarefa(s) criada(s)${base.p_assign ? ' e técnico notificado' : ''}.`);
      location.hash = n === 1 ? `#/tarefa/${lastId}` : '#/tarefas';
    } catch (err) { toast(friendly(err), true); b.disabled = false; $('#prog').textContent = ''; }
  };
}
