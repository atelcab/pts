<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATELCAB · Gestão de PTs</title>
<meta name="theme-color" content="#1b2559">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M58 4 22 56h24l-8 40 40-56H54z' fill='%23c62828'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--navy:#1b2559;--navy2:#2a3577;--red:#c62828;--bg:#f3f5f9;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
--blue:#2563eb;--amber:#d97706;--purple:#7c3aed;--green:#16a34a;--teal:#0d9488;--gray:#6b7280;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
a{color:var(--blue)}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .wm{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:18px;letter-spacing:.5px}
.brand small{display:block;font-size:11px;opacity:.75;font-family:system-ui,sans-serif;letter-spacing:0;font-weight:400}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{color:#cbd5e1;text-decoration:none;padding:8px 12px;border-radius:8px;white-space:nowrap;font-size:14px}
nav a.on,nav a:hover{background:var(--navy2);color:#fff}
.who{font-size:13px;opacity:.9;white-space:nowrap;cursor:pointer}
main{max-width:1100px;margin:auto;padding:16px}
h1{font-size:21px;margin:4px 0 16px;color:var(--navy)}h2{font-size:17px;margin:0 0 12px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-left:4px solid var(--c,var(--navy));text-decoration:none;color:inherit}
.stat .n{font-size:28px;font-weight:700}.stat .l{color:var(--muted);font-size:13px}
.progress{height:14px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress div{height:100%;background:var(--green)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}td.num,th.num{text-align:center}
.scroll{overflow-x:auto}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#ecfeff;color:var(--teal);font-weight:600;margin-left:6px}
.late{color:var(--red);font-weight:600;font-size:12px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
label.chk{display:flex;align-items:center;gap:8px;font-weight:500}label.chk input{width:auto}
input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:150px}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
button:disabled{opacity:.5;cursor:wait}
.btn-main{background:var(--red)}.btn-green{background:var(--green)}.btn-red{background:#b91c1c}.btn-teal{background:var(--teal)}
.btn-light{background:#fff;color:var(--navy);border:1px solid #d1d5db}.btn-sm{padding:6px 11px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.list .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.list .item:hover{background:#f9fafb}.list .item:last-child{border-bottom:0}
.item .t{font-weight:600}.item .s{color:var(--muted);font-size:13px;margin-top:2px}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.ev{position:relative;margin-bottom:16px}.ev:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--gray))}
.ev .h{font-size:13px;color:var(--muted)}.ev .h b{color:var(--text)}
.ev .c{background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:6px;white-space:pre-wrap}
.muted{color:var(--muted)}.small{font-size:13px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--navy),#0e1438)}
.login{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:380px}
.login .logo{display:flex;justify-content:center;margin-bottom:6px}
.login .wm{font-family:Georgia,serif;font-weight:700;font-size:24px;color:var(--navy);text-align:center}
.login .sub{text-align:center;color:#4f6bd8;font-size:13px;margin-bottom:8px}
.sep{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;display:none;z-index:99;max-width:90%}
#toast.err{background:var(--red)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}
.files{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.file{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#f9fafb;text-decoration:none;color:var(--navy);font-size:14px;word-break:break-all}
@media (max-width:640px){.bar{flex-wrap:wrap}nav{order:3;flex-basis:100%}.who{margin-left:auto}.hide-m{display:none}.brand small{display:none}}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden;flex:0 0 auto}
.lang button{padding:5px 9px;background:transparent;color:#cbd5e1;font-size:12px;border-radius:0;font-weight:700}
.lang button.on{background:#fff;color:var(--navy)}
.lang.light{border-color:#d1d5db}.lang.light button{color:var(--navy)}.lang.light button.on{background:var(--navy);color:#fff}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
// ================= Marca ATELCAB =================
function logo(size = 40, light = false) {
  const blue = light ? '#ffffff' : '#1b2559';
  const arc = y => `<path d="M30 ${y}h-14a7 7 0 0 0 0 14h14" fill="none" stroke="${blue}" stroke-width="3.2" stroke-linecap="round"/>
                    <path d="M30 ${y}h14a7 7 0 0 1 0 14h-14" fill="none" stroke="${blue}" stroke-width="3.2" stroke-linecap="round"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 80 64" aria-label="ATELCAB">
    <path d="M30 6v52" stroke="${blue}" stroke-width="3.2"/>${arc(6)}${arc(22)}${arc(38)}
    <path d="M68 4 56 30h9l-6 26 17-32h-9l7-20z" fill="#c62828"/></svg>`;
}
const EMPRESA = 'ATELCAB, LDA.';

// ================= Língua · Language =================
let LANG = null;
try { LANG = localStorage.getItem('atelcab_lang'); } catch (e) {}
const L = () => LANG || ((typeof me !== 'undefined' && me?.role === 'cliente') ? 'en' : 'pt');
const tr = (pt, en) => L() === 'en' ? en : pt;
const SLOGAN = () => tr('Construções e Projectos Eléctricos', 'Electrical Construction & Engineering');
function setLang(l) {
  LANG = l; try { localStorage.setItem('atelcab_lang', l); } catch (e) {}
  document.documentElement.lang = l;
  if (me) route(); else renderLogin();
}
const langSw = (light = false) => `<div class="lang ${light ? 'light' : ''}">
  <button type="button" class="${L() === 'pt' ? 'on' : ''}" onclick="setLang('pt')">PT</button>
  <button type="button" class="${L() === 'en' ? 'on' : ''}" onclick="setLang('en')">EN</button></div>`;

// ================= Utilitários =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOC = () => L() === 'en' ? 'en-GB' : 'pt-PT';
const fmtDate = d => d ? new Date(d.length === 10 ? d + 'T00:00:00' : d).toLocaleDateString(LOC()) : '—';
const fmtDT = d => d ? new Date(d).toLocaleString(LOC(), {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const today = () => new Date().toISOString().slice(0, 10);
const safeName = n => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_');
function toast(msg, err = false) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 6000 : 3000);
}
// Mensagens do servidor (em português) traduzidas para inglês
const ERR_EN = [
  [/Invalid login/i, 'Wrong email or password.', 'Email ou palavra-passe incorrectos.'],
  [/aguardar a sua resposta/, 'This drawing is not awaiting your response.'],
  [/Descreva as altera/, 'Please describe the changes you need.'],
  [/Coment[aá]rio vazio/, 'The comment is empty.'],
  [/Sem acesso/, 'You do not have access to this item.'],
  [/mais de 50 MB/, 'One of the files is larger than 50 MB.'],
  [/J[áa] existe uma tarefa com o c[óo]digo/, 'A task with this code already exists.'],
  [/Junte pelo menos um ficheiro/, 'Please attach at least one file.'],
  [/Indique o c[óo]digo/, 'Please enter the PT code.'],
  [/Escolha pelo menos um ficheiro/, 'Please choose at least one file.'],
  [/s[óo] administradores|Apenas administradores|N[ãa]o autorizado/i, 'Only administrators can do this.'],
  [/n[ãa]o est[áa] aprovad/i, 'This task is not approved yet.'],
  [/n[ãa]o est[áa] atribu[íi]d|n[ãa]o [ée] sua/i, 'This task is not assigned to you.'],
  [/n[ãa]o foi submetid|n[ãa]o est[áa] submetid/i, 'This task has not been submitted.'],
];
const friendly = e => { const m = e?.message || String(e);
  for (const [re, en, pt] of ERR_EN) if (re.test(m)) return L() === 'en' ? en : (pt || m);
  return L() === 'en' ? 'Something went wrong. Please try again. (' + m + ')' : m; };

const STATUS = {
  pendente:{l:'Por atribuir',en:'Not assigned',c:'var(--gray)'}, atribuido:{l:'Atribuído',en:'Assigned',c:'var(--blue)'},
  em_progresso:{l:'Em progresso',en:'In progress',c:'var(--amber)'}, submetido:{l:'Aguarda revisão',en:'Awaiting review',c:'var(--purple)'},
  devolvido:{l:'Devolvido',en:'Returned',c:'var(--red)'}, aprovado:{l:'Aprovado · por enviar',en:'Approved · to send',c:'var(--green)'},
  enviado_cliente:{l:'Enviado ao cliente',en:'Sent to client',c:'var(--teal)'}, aceite_cliente:{l:'Aceite pelo cliente',en:'Accepted by client',c:'var(--green)'},
  alteracoes_cliente:{l:'Cliente pediu alterações',en:'Client requested changes',c:'var(--red)'},
};
// O que o cliente vê
const CSTATUS = { enviado_cliente:{l:'Para rever',en:'To review',c:'var(--teal)'}, aceite_cliente:{l:'Aceite',en:'Accepted',c:'var(--green)'},
  alteracoes_cliente:{l:'Alterações pedidas',en:'Changes requested',c:'var(--red)'} };
const CREV = {l:'Em revisão pela ATELCAB',en:'Being revised by ATELCAB',c:'var(--amber)'};
const sl = x => tr(x.l, x.en);
const stName = s => STATUS[s] ? sl(STATUS[s]) : s;
const DONE = ['aprovado','enviado_cliente','aceite_cliente'];
const badge = s => { const x = (isCliente() && (CSTATUS[s] || CREV)) || STATUS[s] || {l:s,en:s,c:'var(--gray)'};
  return `<span class="badge" style="--c:${x.c}">${sl(x)}</span>`; };
const isLate = t => t.due_date && !DONE.includes(t.status) && t.due_date < today();
const EVENTS = { criado:'criou a tarefa', atribuido:'atribuiu a tarefa', iniciado:'começou a trabalhar', submetido:'submeteu o trabalho',
  aprovado:'aprovou ✔', devolvido:'devolveu para correcção', comentario:'comentou', enviado_cliente:'enviou ao cliente 📨',
  cliente_aceite:'ACEITOU o drawing ✔', cliente_alteracoes:'pediu alterações', ficheiros:'juntou ficheiros 📎', aprovado_offline:'registou como já aprovado (fora da plataforma) ✔' };
const EVENTS_EN = { criado:'created the task', atribuido:'assigned the task', iniciado:'started working', submetido:'submitted the work',
  aprovado:'approved ✔', devolvido:'returned for correction', comentario:'commented', enviado_cliente:'sent to the client 📨',
  cliente_aceite:'ACCEPTED the drawing ✔', cliente_alteracoes:'requested changes', ficheiros:'added files 📎', aprovado_offline:'registered as already approved (outside the platform) ✔' };
// Como o cliente vê os eventos
const CEVENTS = { enviado_cliente:['enviou o drawing para a sua apreciação 📨','sent the drawing for your review 📨'] };
const evName = k => isCliente() && CEVENTS[k] ? tr(...CEVENTS[k]) : (tr(EVENTS[k], EVENTS_EN[k]) || k);
const EVCOLOR = { criado:'var(--gray)', atribuido:'var(--blue)', iniciado:'var(--amber)', submetido:'var(--purple)', aprovado:'var(--green)',
  devolvido:'var(--red)', comentario:'var(--navy)', enviado_cliente:'var(--teal)', cliente_aceite:'var(--green)', cliente_alteracoes:'var(--red)', ficheiros:'var(--blue)', aprovado_offline:'var(--green)' };

// ================= Estado =================
let sb, me = null, people = [];
const isAdmin = () => me?.role === 'admin', isCliente = () => me?.role === 'cliente';
const nameOf = id => { const p = people.find(x => x.id === id); return p ? (p.full_name || p.email) : '—'; };
const techs = () => people.filter(p => p.role === 'tecnico').concat(people.filter(p => p.role === 'admin'));
const ROLE = { admin:['Administrador','Administrator'], tecnico:['Técnico','Technician'], cliente:['Cliente','Client'] };
const roleName = r => ROLE[r] ? tr(...ROLE[r]) : r;

// ================= Arranque =================
async function boot() {
  document.documentElement.lang = L();
  if (typeof SUPABASE_URL === 'undefined' || !/^https:\/\//.test(SUPABASE_URL) || !SUPABASE_KEY || SUPABASE_KEY.includes('COLE')) {
    $('#root').innerHTML = `<div class="center"><div class="login"><div class="logo">${logo(70)}</div><div class="wm">ATELCAB</div>
      <p class="muted">Falta configurar: crie o ficheiro <b>config.js</b> com o Project URL e a chave do Supabase.</p></div></div>`;
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange(ev => {
    if (ev === 'PASSWORD_RECOVERY') renderNewPassword();
    if (ev === 'SIGNED_OUT') { me = null; renderLogin(); }
  });
  const { data } = await sb.auth.getSession();
  if (location.hash.includes('type=recovery')) return;
  if (data.session) await enter(); else renderLogin();
}
async function enter() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return renderLogin();
  await loadPeople();
  me = people.find(p => p.id === user.id);
  if (!me) { toast(tr('Perfil não encontrado. Contacte a ATELCAB.', 'Profile not found. Please contact ATELCAB.'), true); await sb.auth.signOut(); return; }
  document.documentElement.lang = L();
  window.onhashchange = route;
  if (!location.hash || location.hash === '#' || location.hash.startsWith('#access_token')) location.hash = '#/painel'; else route();
}
async function loadPeople() {
  const { data, error } = await sb.from('profiles').select('*').order('full_name');
  if (error) throw error; people = data;
}
function loginBox(inner) {
  return `<div class="center"><form class="login" id="f"><div style="display:flex;justify-content:flex-end">${langSw(true)}</div>
    <div class="logo">${logo(76)}</div>
    <div class="wm">${EMPRESA}</div><div class="sub">${SLOGAN()}</div>${inner}</form></div>`;
}
function renderLogin() {
  window.onhashchange = null;
  $('#root').innerHTML = loginBox(`<p class="muted small" style="text-align:center;margin:0">${tr('Plataforma de Gestão de Projectos', 'Project Management Portal')}</p>
    <label>Email</label><input type="email" name="email" required autocomplete="email">
    <label>${tr('Palavra-passe', 'Password')}</label><input type="password" name="pw" required autocomplete="current-password">
    <div class="actions"><button class="btn-main" style="width:100%">${tr('Entrar', 'Sign in')}</button></div>
    <p class="small" style="text-align:center"><a href="#" id="forgot">${tr('Esqueci a palavra-passe', 'Forgot password')}</a></p>`);
  $('#f').onsubmit = async e => {
    e.preventDefault(); const b = e.submitter; b.disabled = true; const f = new FormData(e.target);
    const { error } = await sb.auth.signInWithPassword({ email: f.get('email').trim(), password: f.get('pw') });
    b.disabled = false; if (error) return toast(friendly(error), true);
    location.hash = '#/painel'; enter();
  };
  $('#forgot').onclick = async e => {
    e.preventDefault(); const email = $('#f [name=email]').value.trim();
    if (!email) return toast(tr('Escreva primeiro o seu email.', 'Please type your email first.'), true);
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) return toast(friendly(error), true);
    toast(tr('Enviámos um email com o link.', 'We sent you an email with a reset link.'));
  };
}
function renderNewPassword() {
  $('#root').innerHTML = loginBox(`<h2 style="text-align:center">${tr('Nova palavra-passe', 'New password')}</h2>
    <input type="password" name="pw" minlength="6" placeholder="${tr('Mín. 6 caracteres', 'Min. 6 characters')}" required>
    <div class="actions"><button class="btn-main" style="width:100%">${tr('Guardar', 'Save')}</button></div>`);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: new FormData(e.target).get('pw') });
    if (error) return toast(friendly(error), true);
    toast(tr('Palavra-passe alterada.', 'Password changed.')); history.replaceState(null, '', location.pathname + '#/painel'); enter();
  };
}

// ================= Layout =================
function shell(active, html) {
  const links = [['painel', tr('📊 Painel','📊 Dashboard')], ['tarefas', isCliente() ? '📄 Drawings' : isAdmin() ? tr('📋 Tarefas','📋 Tasks') : tr('📋 As minhas tarefas','📋 My tasks')]];
  if (!isCliente()) links.push(['aprovados', tr('✅ PTs aprovados','✅ Approved PTs')]);
  if (isAdmin()) links.push(['nova', tr('➕ Nova tarefa','➕ New task')], ['equipa', tr('👥 Equipa','👥 Team')]);
  $('#root').innerHTML = `<header><div class="bar">
    <a class="brand" href="#/painel" style="color:#fff;text-decoration:none">${logo(34, true)}<div><span class="wm">ATELCAB</span><small>${tr('Gestão de PTs','Project Portal')}</small></div></a>
    <nav>${links.map(([k,l]) => `<a href="#/${k}" class="${active===k?'on':''}">${l}</a>`).join('')}</nav>
    ${langSw()}
    <div class="who" onclick="location.hash='#/conta'">👤 ${esc(me.full_name || me.email)}${isAdmin() ? ' · admin' : isCliente() ? tr(' · cliente',' · client') : ''}</div>
  </div></header><main>${html}</main>`;
}
async function route() {
  const [, page, id] = location.hash.split('?')[0].split('/');
  try {
    if (page === 'tarefa' && id) return await viewTask(+id);
    if (page === 'tarefas') return await viewTasks();
    if (page === 'aprovados' && !isCliente()) return await viewApproved();
    if (page === 'nova' && isAdmin()) return viewNew();
    if (page === 'equipa' && isAdmin()) return await viewTeam();
    if (page === 'conta') return viewAccount();
    return await viewDashboard();
  } catch (e) { console.error(e); toast(friendly(e), true); }
}
const FASES = { fase1:'1ª Fase', fase2:'2ª Fase', reabilitacao:'Reabilitação' };
const FCOL = { fase1:'#2563eb', fase2:'#7c3aed', reabilitacao:'#d97706' };
const FASES_EN = { fase1:'Phase 1', fase2:'Phase 2', reabilitacao:'Rehabilitation' };
const faseName = f => f ? tr(FASES[f], FASES_EN[f]) : tr('Sem fase', 'No phase');
const faseBadge = f => f ? `<span class="badge" style="--c:${FCOL[f]}">${faseName(f)}</span>` : '';
const faseSelect = (name, val, empty) => `<select name="${name}"><option value="">${empty || tr('— sem fase —','— no phase —')}</option>${Object.keys(FASES).map(k => `<option value="${k}" ${val===k?'selected':''}>${faseName(k)}</option>`).join('')}</select>`;

async function fetchTasks() {
  const { data, error } = await sb.from('tasks')
    .select('id,code,title,status,fase,assigned_to,due_date,created_at,updated_at,approved_at,sent_to_client_at')
    .order('updated_at', { ascending: false });
  if (error) throw error; return data;
}
const stat = (n, l, col, s) => `<a class="stat" style="--c:${col}" href="#/tarefas${s ? '?s=' + s : ''}"><div class="n">${n}</div><div class="l">${l}</div></a>`;
function itemHTML(t) {
  return `<a class="item" href="#/tarefa/${t.id}"><div><div class="t">${esc(t.code)}${t.title ? ' — ' + esc(t.title) : ''}</div>
    <div class="s">${!isCliente() && t.fase ? faseName(t.fase) + ' · ' : ''}${!isCliente() && t.assigned_to ? '👤 ' + esc(nameOf(t.assigned_to)) + ' · ' : ''}${!isCliente() && t.due_date ? tr('Prazo ','Due ') + fmtDate(t.due_date) + ' · ' : ''}${isCliente() ? tr('Enviado ','Sent ') + fmtDT(t.sent_to_client_at) : tr('act. ','upd. ') + fmtDT(t.updated_at)}
    ${!isCliente() && isLate(t) ? ` <span class="late">· ${tr('ATRASADO','LATE')}</span>` : ''}</div></div>${badge(t.status)}</a>`;
}
const section = (title, list) => list.length ? `<div class="card"><h2>${title}</h2><div class="list">${list.map(itemHTML).join('')}</div></div>` : '';

// Contagens por fase (usadas no painel e no Excel)
function phaseRows(tasks) {
  const groups = [...Object.keys(FASES), null];
  return groups.map(f => {
    const l = tasks.filter(t => (t.fase || null) === f), k = s => l.filter(t => s.includes(t.status)).length;
    return { f, nome: faseName(f), total: l.length, feitos: k(DONE), curso: k(['atribuido','em_progresso']), rev: k(['submetido']),
      dev: k(['devolvido','alteracoes_cliente']), pend: k(['pendente']), cli: k(['enviado_cliente']), aceites: k(['aceite_cliente']), late: l.filter(isLate).length };
  }).filter(r => r.f || r.total);
}

async function exportCSV() {
  const tasks = await fetchTasks();
  const order = { fase1: 1, fase2: 2, reabilitacao: 3 };
  tasks.sort((a, b) => (order[a.fase] || 9) - (order[b.fase] || 9) || a.code.localeCompare(b.code, 'pt', { numeric: true }));
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const yes = tr('Sim','Yes');
  const lines = [[`ATELCAB — ${tr('Relatório de PTs','PT Report')} — ${fmtDT(new Date().toISOString())}`], [],
    [tr('RESUMO POR FASE','SUMMARY BY PHASE')], tr(['Fase','Total','Feitos (aprovados)','% feitos','Em curso','Aguarda revisão','Devolvidos','Por atribuir','Com cliente','Aceites pelo cliente','Atrasados'],
      ['Phase','Total','Done (approved)','% done','In progress','Awaiting review','Returned','Not assigned','With client','Accepted by client','Late'])];
  const ph = phaseRows(tasks);
  ph.forEach(r => lines.push([r.nome, r.total, r.feitos, r.total ? Math.round(r.feitos / r.total * 100) + '%' : '0%', r.curso, r.rev, r.dev, r.pend, r.cli, r.aceites, r.late]));
  const sum = k => ph.reduce((s, r) => s + r[k], 0), tot = sum('total');
  lines.push(['TOTAL', tot, sum('feitos'), tot ? Math.round(sum('feitos') / tot * 100) + '%' : '0%', sum('curso'), sum('rev'), sum('dev'), sum('pend'), sum('cli'), sum('aceites'), sum('late')]);
  lines.push([], [tr('DETALHE','DETAIL')], tr(['Fase','Código','Título','Estado','Técnico','Prazo','Atrasado','Criado em','Última actualização','Aprovado em','Enviado ao cliente'],
    ['Phase','Code','Title','Status','Technician','Due date','Late','Created','Last update','Approved','Sent to client']));
  tasks.forEach(t => lines.push([faseName(t.fase), t.code, t.title, stName(t.status), t.assigned_to ? nameOf(t.assigned_to) : '',
    t.due_date ? fmtDate(t.due_date) : '', isLate(t) ? yes : '', fmtDT(t.created_at), fmtDT(t.updated_at), t.approved_at ? fmtDT(t.approved_at) : '', t.sent_to_client_at ? fmtDT(t.sent_to_client_at) : '']));
  const csv = '﻿' + lines.map(r => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `ATELCAB-${tr('relatorio','report')}-PTs-${today()}.csv`; a.click();
}

const ACCEPT = '.pdf,.xls,.xlsx,.xlsm,.csv,.doc,.docx,.dwg,.dxf,.kmz,.kml,.zip,image/*';
const icon = n => /\.pdf$/i.test(n) ? '📄' : /\.(xlsx?|xlsm|csv)$/i.test(n) ? '📊' : /\.(jpe?g|png|gif|webp|heic)$/i.test(n) ? '🖼️' : /\.(docx?)$/i.test(n) ? '📝' : /\.(dwg|dxf)$/i.test(n) ? '📐' : '📎';
const actFiles = a => a?.files?.length ? a.files : a?.file_path ? [{ path: a.file_path, name: a.file_name }] : [];
async function openFile(path, name) {
  const w = window.open('', '_blank');
  const inline = /\.(pdf|jpe?g|png|gif|webp)$/i.test(name || path);
  const { data, error } = await sb.storage.from('drawings').createSignedUrl(path, 3600, inline ? undefined : { download: name || true });
  if (error) { w?.close(); return toast(friendly(error), true); }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}
function filesHTML(list, title) {
  if (!list?.length) return '';
  return `<div class="files">${title ? `<div class="small muted" style="margin-bottom:4px">${title}</div>` : ''}${list.map(f =>
    `<a href="#" class="file" onclick="openFile('${esc(f.path)}','${esc(f.name || '')}');return false">${icon(f.name || f.path)} ${esc(f.name || 'file')}</a>`).join('')}</div>`;
}
async function uploadFiles(fileList, folder, prog) {
  const files = [...(fileList || [])].filter(f => f && f.size);
  const out = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (f.size > 50 * 1024 * 1024) throw new Error(`"${f.name}" tem mais de 50 MB.`);
    const msg = tr(`A carregar ${i + 1} de ${files.length}: ${f.name}…`, `Uploading ${i + 1} of ${files.length}: ${f.name}…`); if (prog) prog.textContent = msg; else toast(msg);
    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${safeName(f.name)}`;
    const { error } = await sb.storage.from('drawings').upload(path, f, { contentType: f.type || 'application/octet-stream' });
    if (error) throw error;
    out.push({ path, name: f.name });
  }
  if (prog) prog.textContent = '';
  return out;
}
const fileInput = (label, hint) => `<label>${label}</label><input type="file" name="files" multiple accept="${ACCEPT}">
  <p class="small muted" style="margin:4px 0 0">${hint || tr('Pode escolher vários ficheiros de uma vez: PDF, Excel, fotos…', 'You can select several files at once: PDF, Excel, photos…')}</p><p class="small" data-prog></p>`;

  if (!taskFiles.length && t.drawing_path) taskFiles.push({ path: t.drawing_path, name: t.drawing_name });
  const lastSub = [...all].reverse().find(a => a.kind === 'submetido' && actFiles(a).length);
  const finalFiles = t.final_files?.length ? t.final_files : t.final_path ? [{ path: t.final_path, name: t.final_name }] : [];

  let filesBlock = '', actions = '', forms = '';
  if (isCliente()) {
    filesBlock = filesHTML(finalFiles, `📥 ${tr('Ficheiros da ATELCAB','Files from ATELCAB')} (${finalFiles.length})`);

  } else {
    filesBlock = filesHTML(taskFiles, `📂 ${tr('Ficheiros da tarefa','Task files')} (${taskFiles.length})`)
      + (lastSub ? filesHTML(actFiles(lastSub), `📤 ${tr('Última submissão','Latest submission')} — ${esc(nameOf(lastSub.user_id))}, ${fmtDT(lastSub.created_at)} (${actFiles(lastSub).length})`) : '')
      + (finalFiles.length ? filesHTML(finalFiles, `📨 ${tr('Enviado ao cliente','Sent to the client')} (${finalFiles.length})`) : '');
    if (mine && ['atribuido','devolvido'].includes(t.status))
      actions += `<button class="btn-main" onclick="act('start_task',{p_task:${id}})">▶ ${tr('Começar a trabalhar','Start working')}</button>`;
    if (mine && ['atribuido','em_progresso','devolvido'].includes(t.status)) {
      actions += `<button onclick="$('#subbox').style.display='block';this.remove()">📤 ${tr('Submeter trabalho','Submit work')}</button>`;
      forms += `<form id="subbox" class="sep" style="display:none">${fileInput(tr('Ficheiros do trabalho feito','Files of the completed work'), tr('Escolha todos os ficheiros de uma vez (PDF, Excel, fotos…). Sem limite de quantidade.','Select all the files at once (PDF, Excel, photos…). No limit on the number.'))}
        <label>${tr('Alterações feitas *','Changes made *')}</label><textarea name="c" required placeholder="${tr('Descreva as mudanças que fez…','Describe the changes you made…')}"></textarea>
        <div class="actions"><button class="btn-main">${tr('Enviar para revisão','Send for review')}</button></div></form>`;
    }
    if (isAdmin() && t.status === 'submetido') {
      actions += `<button class="btn-green" onclick="approve(${id})">✔ ${tr('Aprovar','Approve')}</button>
        <button class="btn-red" onclick="$('#retbox').style.display='block'">↩ ${tr('Devolver','Return')}</button>`;
      forms += `<form id="retbox" class="sep" style="display:none"><label>${tr('O que precisa de ser corrigido? *','What needs to be corrected? *')}</label><textarea name="c" required></textarea>
        <div class="actions"><button class="btn-red">${tr('Devolver ao técnico','Return to technician')}</button></div></form>`;
    }
    if (isAdmin() && t.status === 'aprovado') {
      const n = lastSub ? actFiles(lastSub).length : taskFiles.length;
      actions += `<button class="btn-teal" onclick="$('#sendbox').style.display='block';this.remove()">📨 ${tr('Enviar ao cliente','Send to client')}</button>`;
      forms += `<form id="sendbox" class="sep" style="display:none">
        <p class="small muted">${tr(`Serão enviados os <b>${n} ficheiro(s)</b> ${lastSub ? 'da última submissão' : 'da tarefa'}. Para enviar outros, escolha-os abaixo.`,
          `The <b>${n} file(s)</b> of the ${lastSub ? 'latest submission' : 'task'} will be sent. To send other files, choose them below.`)}</p>
        ${fileInput(tr('Outros ficheiros (opcional)','Other files (optional)'))}
        <label>${tr('Mensagem para o cliente (opcional)','Message to the client (optional)')}</label><textarea name="c" placeholder="${tr('Segue o drawing para sua apreciação…','Please find attached the drawing for your review…')}"></textarea>
        <div class="actions"><button class="btn-teal">📨 ${tr('Enviar ao cliente','Send to client')}</button></div></form>`;
    }
    if (isAdmin()) {
      actions += `<button class="btn-light" onclick="$('#addbox').style.display='block';this.remove()">➕ ${tr('Juntar ficheiros','Add files')}</button>`;
      forms += `<form id="addbox" class="sep" style="display:none">${fileInput(tr('Ficheiros a juntar à tarefa','Files to add to the task'))}
        <label>${tr('Nota (opcional)','Note (optional)')}</label><input name="c" placeholder="${tr('ex.: Excel actualizado do Hakeem','e.g. Updated Excel from Hakeem')}">
        <div class="actions"><button>${tr('Juntar e avisar o técnico','Add and notify the technician')}</button></div></form>`;
    }
  }

  const tl = all.map(a => `<div class="ev" style="--c:${EVCOLOR[a.kind] || 'var(--gray)'}">
      <div class="h"><b>${esc(nameOf(a.user_id))}</b> ${evName(a.kind)} · ${fmtDT(a.created_at)}${!isCliente() && a.visible_cliente ? `<span class="tag">👁 ${tr('cliente','client')}</span>` : ''}</div>
      ${a.comment ? `<div class="c">${esc(a.comment)}</div>` : ''}${filesHTML(actFiles(a))}
    </div>`).join('') || `<p class="muted">${tr('Sem histórico.','No history yet.')}</p>`;

  shell('tarefas', `<p class="small"><a href="#/${isCliente() ? 'painel' : 'tarefas'}">${tr('← Voltar','← Back')}</a></p>
    <div class="card">
      <div class="row" style="align-items:center"><h1 style="margin:0">${esc(t.code)}${t.title ? ' — ' + esc(t.title) : ''}</h1><div style="flex:0;display:flex;gap:6px">${faseBadge(t.fase)}${badge(t.status)}</div></div>
      ${!isCliente() && isLate(t) ? `<p class="late">⚠ ${tr('Prazo ultrapassado','Deadline passed')}</p>` : ''}
      ${isCliente() ? `<p class="small muted">${t.fase ? faseName(t.fase) + ' · ' : ''}${tr('Enviado pela','Sent by')} ${EMPRESA} ${tr('em','on')} ${fmtDT(t.sent_to_client_at)}</p>` : `<div class="kv" style="margin-top:14px">
        <div>${tr('Fase','Phase')}</div><div>${t.fase ? faseName(t.fase) : `<i class="muted">${tr('sem fase','no phase')}</i>`}</div>
        <div>${tr('Técnico','Technician')}</div><div>${t.assigned_to ? esc(nameOf(t.assigned_to)) : `<i class="muted">${tr('por atribuir','not assigned')}</i>`}</div>
        <div>${tr('Prazo','Due date')}</div><div>${fmtDate(t.due_date)}</div>
        <div>${tr('Criado','Created')}</div><div>${fmtDT(t.created_at)} ${tr('por','by')} ${esc(nameOf(t.created_by))}</div>
        ${t.approved_at ? `<div>${tr('Aprovado','Approved')}</div><div>${fmtDT(t.approved_at)} ${tr('por','by')} ${esc(nameOf(t.approved_by))}</div>` : ''}
        ${t.sent_to_client_at ? `<div>${tr('Ao cliente','To client')}</div><div>${fmtDT(t.sent_to_client_at)}</div>` : ''}</div>
        ${t.description ? `<p style="white-space:pre-wrap;background:#f9fafb;padding:10px;border-radius:8px">${esc(t.description)}</p>` : ''}`}
      ${filesBlock}
      <div class="actions">${actions}</div>${forms}
    </div>
    ${isAdmin() && !DONE.includes(t.status) ? `<div class="card"><h2>${t.status === 'alteracoes_cliente' ? tr('Atribuir correcções do cliente','Assign client corrections') : tr('Atribuir','Assign')}</h2><div class="row">
      <div><select id="asg"><option value="">${tr('— escolher técnico —','— choose technician —')}</option>
        ${techs().map(p => `<option value="${p.id}" ${p.id === t.assigned_to ? 'selected' : ''}>${esc(p.full_name || p.email)}${p.role==='admin'?' (admin)':''}</option>`).join('')}</select></div>
      <div style="flex:0"><button onclick="assign(${id})">${t.assigned_to ? tr('Reatribuir','Reassign') : tr('Atribuir','Assign')} ${tr('e notificar','and notify')}</button></div></div></div>` : ''}
    <div class="card"><h2>${isCliente() ? tr('Comentários','Comments') : tr('Histórico e comentários','History and comments')}</h2><div class="timeline">${tl}</div>
      <form id="cbox"><label>${tr('Novo comentário','New comment')}</label><textarea name="c" required style="min-height:60px"></textarea>
        ${isAdmin() && t.sent_to_client_at ? `<label class="chk"><input type="checkbox" name="cli"> ${tr('Enviar também ao cliente (ele vê e recebe email)','Also send to the client (they see it and get an email)')}</label>` : ''}
        <div class="actions"><button class="btn-light">💬 ${tr('Comentar','Send comment')}</button></div></form></div>
    ${isAdmin() ? `<div class="card"><h2>${tr('Editar tarefa','Edit task')}</h2><form id="edit">
      <div class="row"><div><label>${tr('Código','Code')}</label><input name="code" value="${esc(t.code)}" required></div>
        <div><label>${tr('Título','Title')}</label><input name="title" value="${esc(t.title || '')}"></div></div>
      <div class="row"><div><label>${tr('Fase','Phase')}</label>${faseSelect('fase', t.fase)}</div>
        <div><label>${tr('Prazo','Due date')}</label><input type="date" name="due" value="${t.due_date || ''}"></div></div>
      <label>${tr('Descrição (interna)','Description (internal)')}</label><textarea name="desc">${esc(t.description || '')}</textarea>
      <div class="actions"><button class="btn-light">${tr('Guardar','Save')}</button>
        <button type="button" class="btn-red btn-sm" style="margin-left:auto" onclick="delTask(${id})">🗑 ${tr('Eliminar','Delete')}</button></div></form></div>` : ''}`);

  const on = (sel, fn) => { const f = $(sel); if (f) f.onsubmit = async e => {
    e.preventDefault(); const b = e.submitter; b.disabled = true;
    try { await fn(e.target, new FormData(e.target)); route(); } catch (err) { toast(friendly(err), true); b.disabled = false; } }; };
  const up = (f, folder) => uploadFiles(f.querySelector('input[type=file]')?.files, folder, f.querySelector('[data-prog]'));
  on('#subbox', async (f, d) => { const files = await up(f, `submissoes/${id}`);
    await rpc('submit_task', { p_task: id, p_comment: d.get('c'), p_files: files });
    toast(tr(`Submetido com ${files.length} ficheiro(s). Os administradores foram notificados.`, `Submitted with ${files.length} file(s). The administrators were notified.`)); });
  on('#retbox', async (f, d) => { await rpc('return_task', { p_task: id, p_comment: d.get('c') }); toast(tr('Devolvido ao técnico.','Returned to the technician.')); });
  on('#sendbox', async (f, d) => { const files = await up(f, `cliente-envios/${id}`);
    await rpc('send_to_client', { p_task: id, p_message: d.get('c'), p_files: files }); toast(tr('📨 Enviado ao cliente.','📨 Sent to the client.')); });
  on('#addbox', async (f, d) => { const files = await up(f, `originais/${id}`);
    if (!files.length) throw new Error('Escolha pelo menos um ficheiro.');
    await rpc('add_task_files', { p_task: id, p_files: files, p_comment: d.get('c') }); toast(tr(`${files.length} ficheiro(s) juntos.`, `${files.length} file(s) added.`)); });
  on('#altbox', async (f, d) => { const files = await up(f, `cliente/${id}`);
    await rpc('client_respond', { p_task: id, p_accept: false, p_comment: d.get('c'), p_files: files }); toast(tr('O seu pedido de alterações foi enviado à ATELCAB.','Your change request was sent to ATELCAB.')); });
  on('#cbox', async (f, d) => { await rpc('add_comment', { p_task: id, p_comment: d.get('c'), p_to_client: !!d.get('cli') }); });
  on('#edit', async (f, d) => {
    const { error } = await sb.from('tasks').update({ code: d.get('code').trim(), title: d.get('title').trim() || null, fase: d.get('fase') || null,
      due_date: d.get('due') || null, description: d.get('desc').trim() || null, updated_at: new Date().toISOString() }).eq('id', id);
    if (error) throw error; toast(tr('Guardado.','Saved.')); });
}
async function rpc(fn, args) { const { error } = await sb.rpc(fn, args); if (error) throw error; }
async function act(fn, args) { try { await rpc(fn, args); route(); } catch (e) { toast(friendly(e), true); } }
async function approve(id) {
  const c = prompt(tr('Aprovar este PT. Comentário (opcional):','Approve this PT. Comment (optional):'), ''); if (c === null) return;
  try { await rpc('approve_task', { p_task: id, p_comment: c }); toast(tr('✔ Aprovado e contabilizado.','✔ Approved and counted.')); route(); } catch (e) { toast(friendly(e), true); }
}
async function clientAccept(id) {
  const c = prompt(tr('Aceitar este drawing. Comentário (opcional):','Accept this drawing. Comment (optional):'), ''); if (c === null) return;
  try { await rpc('client_respond', { p_task: id, p_accept: true, p_comment: c, p_files: [] }); toast(tr('✔ Obrigado! Drawing aceite.','✔ Thank you! Drawing accepted.')); route(); }
  catch (e) { toast(friendly(e), true); }
}
async function assign(id) {
  const u = $('#asg').value; if (!u) return toast(tr('Escolha um técnico.','Choose a technician.'), true);
  try { await rpc('assign_task', { p_task: id, p_user: u }); toast(tr('Atribuído. O técnico recebeu um email.','Assigned. The technician received an email.')); route(); } catch (e) { toast(friendly(e), true); }
}
async function delTask(id) {
  if (!confirm(tr('Eliminar esta tarefa e todo o histórico? Não pode ser desfeito.','Delete this task and all its history? This cannot be undone.'))) return;
  const { error } = await sb.from('tasks').delete().eq('id', id);
  if (error) return toast(friendly(error), true);
  toast(tr('Tarefa eliminada.','Task deleted.')); location.hash = '#/tarefas';
}

// ================= Nova tarefa =================
function viewNew() {
  shell('nova', `<h1>${tr('Nova tarefa','New task')}</h1><form class="card" id="nf">
    <div class="row"><div><label>${tr('Código do PT *','PT code *')}</label><input name="code" placeholder="${tr('ex.: PT 12','e.g. PT 12')}"></div>
      <div><label>${tr('Fase','Phase')}</label>${faseSelect('fase', '')}</div></div>
    <label>${tr('Título','Title')}</label><input name="title" placeholder="${tr('ex.: Revisão do esquema unifilar','e.g. Single-line diagram revision')}">
    ${fileInput(tr('Ficheiros para o técnico','Files for the technician'), tr('Drawings PDF, Excel, fotos… Pode escolher vários de uma vez — ficam todos nesta tarefa.','PDF drawings, Excel, photos… You can select several at once — they all stay in this task.'))}
    <label class="chk"><input type="checkbox" name="split"> ${tr('Criar <b>uma tarefa por ficheiro</b> (o nome do ficheiro passa a ser o código do PT)','Create <b>one task per file</b> (the file name becomes the PT code)')}</label>
    <label>${tr('Instruções para o técnico','Instructions for the technician')}</label><textarea name="desc" placeholder="${tr('O que deve ser feito…','What needs to be done…')}"></textarea>
    <div class="row"><div><label>${tr('Atribuir a','Assign to')}</label><select name="who"><option value="">${tr('— atribuir depois —','— assign later —')}</option>
        ${techs().map(p => `<option value="${p.id}">${esc(p.full_name || p.email)}${p.role==='admin'?' (admin)':''}</option>`).join('')}</select></div>
      <div><label>${tr('Prazo','Due date')}</label><input type="date" name="due"></div></div>
    <div class="actions"><button class="btn-main">${tr('Criar tarefa','Create task')}</button></div><p class="small muted" id="prog"></p></form>`);
  $('#nf').onsubmit = async e => {
    e.preventDefault(); const b = e.submitter; b.disabled = true; const f = new FormData(e.target);
    const picked = [...e.target.querySelector('input[type=file]').files].filter(x => x.size), code = f.get('code').trim(), split = !!f.get('split');
    if (!split && !code) { b.disabled = false; return toast(tr('Indique o código do PT.','Please enter the PT code.'), true); }
    if (split && !picked.length) { b.disabled = false; return toast(tr('Escolha os ficheiros (um por tarefa).','Choose the files (one per task).'), true); }
    const base = { p_title: f.get('title').trim(), p_description: f.get('desc').trim(), p_due: f.get('due') || null, p_assign: f.get('who') || null, p_fase: f.get('fase') || null };
    try {
      let lastId, n = 0;
      if (split) {
        for (const file of picked) {
          const files = await uploadFiles([file], 'originais', $('#prog'));
          const { data, error } = await sb.rpc('create_task', { ...base, p_code: file.name.replace(/\.[^.]+$/, ''), p_files: files });
          if (error) throw error; lastId = data; n++;
        }
      } else {
        const files = await uploadFiles(picked, 'originais', $('#prog'));
        const { data, error } = await sb.rpc('create_task', { ...base, p_code: code, p_files: files });
        if (error) throw error; lastId = data; n = 1;
      }
      toast(tr(`${n} tarefa(s) criada(s)${base.p_assign ? ' e técnico notificado' : ''}.`, `${n} task(s) created${base.p_assign ? ' and technician notified' : ''}.`));
      location.hash = n === 1 ? `#/tarefa/${lastId}` : '#/tarefas';
    } catch (err) { toast(friendly(err), true); b.disabled = false; $('#prog').textContent = ''; }
  };
}

        <div class="small muted">${t.fase ? faseName(t.fase) + ' · ' : ''}${t.assigned_to ? '👤 ' + esc(nameOf(t.assigned_to)) + ' · ' : ''}${tr('aprovado','approved')} ${fmtDT(t.approved_at)}</div></div>

  $('#af').oninput = draw; draw();
  $('#ra').onsubmit = async e => {
    e.preventDefault(); const b = e.submitter; b.disabled = true; const f = new FormData(e.target);
    try {
      if (![...e.target.querySelector('input[type=file]').files].some(x => x.size)) throw new Error('Junte pelo menos um ficheiro do PT aprovado.');
      const files = await uploadFiles(e.target.querySelector('input[type=file]').files, 'aprovados', e.target.querySelector('[data-prog]'));
      await rpc('register_approved_task', { p_code: f.get('code').trim(), p_title: f.get('title').trim(), p_fase: f.get('fase') || null,
        p_files: files, p_comment: f.get('note').trim(), p_tecnico: f.get('tec') || null });
      toast(isAdmin() ? tr('✅ PT registado como aprovado.','✅ PT registered as approved.') : tr('✅ PT registado. Os administradores foram avisados.','✅ PT registered. The administrators were notified.')); route();
    } catch (err) { toast(friendly(err), true); b.disabled = false; }
  };
}

// ================= Equipa =================
async function viewTeam() {
  await loadPeople();
  shell('equipa', `<h1>${tr('Equipa e clientes','Team and clients')}</h1>
    <div class="card"><div class="scroll"><table><tr><th>${tr('Nome','Name')}</th><th class="hide-m">Email</th><th>${tr('Função','Role')}</th><th></th></tr>
    ${people.map(p => `<tr><td><input value="${esc(p.full_name || '')}" id="n-${p.id}"></td><td class="hide-m small">${esc(p.email)}</td>
      <td><select id="r-${p.id}" ${p.id === me.id ? 'disabled' : ''}>${Object.keys(ROLE).map(k => `<option value="${k}" ${p.role===k?'selected':''}>${roleName(k)}</option>`).join('')}</select></td>
      <td><button class="btn-sm btn-light" onclick="saveMember('${p.id}')">${tr('Guardar','Save')}</button></td></tr>`).join('')}
    </table></div></div>
    <div class="card small"><h2>${tr('Adicionar técnico ou cliente','Add a technician or client')}</h2>${tr(`<ol style="padding-left:18px;margin:0">
      <li>supabase.com › projecto › <b>Authentication</b> › <b>Users</b> › <b>Add user</b> › <b>Create new user</b>.</li>
      <li>Email + palavra-passe provisória, marque <b>Auto Confirm User</b>.</li>
      <li>Volte aqui: aparece como Técnico. Para cliente, mude a função para <b>Cliente</b>. Corrija o nome e Guardar.</li>
      <li>Envie-lhe o link da plataforma, o email e a palavra-passe.</li></ol>
      <p class="muted">O cliente só vê os drawings que lhe envia, a versão final e os comentários marcados “👁 cliente”.</p>`,
      `<ol style="padding-left:18px;margin:0">
      <li>supabase.com › project › <b>Authentication</b> › <b>Users</b> › <b>Add user</b> › <b>Create new user</b>.</li>
      <li>Email + temporary password, tick <b>Auto Confirm User</b>.</li>
      <li>Come back here: they appear as Technician. For a client, change the role to <b>Client</b>. Fix the name and Save.</li>
      <li>Send them the platform link, the email and the password.</li></ol>
      <p class="muted">The client only sees the drawings you send, the final version and the comments marked “👁 client”.</p>`)}</div>`);
}
async function saveMember(id) {
  const { error } = await sb.from('profiles').update({ full_name: $('#n-' + id).value.trim() || null, role: $('#r-' + id).value }).eq('id', id);
  if (error) return toast(friendly(error), true);
  await loadPeople(); toast(tr('Guardado.','Saved.'));
}

// ================= Conta =================
function viewAccount() {
  shell('conta', `<h1>${tr('A minha conta','My account')}</h1>
    <div class="card"><h2>${tr('Língua','Language')}</h2><div class="actions" style="margin-top:0">
      <button class="${L() === 'pt' ? '' : 'btn-light'}" onclick="setLang('pt')">🇵🇹 Português</button>
      <button class="${L() === 'en' ? '' : 'btn-light'}" onclick="setLang('en')">🇬🇧 English</button></div></div>
    <form class="card" id="nm"><h2>${tr('Nome','Name')}</h2><input name="n" value="${esc(me.full_name || '')}" required><div class="actions"><button class="btn-light">${tr('Guardar nome','Save name')}</button></div></form>
    <form class="card" id="pw"><h2>${tr('Mudar palavra-passe','Change password')}</h2><input type="password" name="p" minlength="6" placeholder="${tr('Nova palavra-passe (mín. 6)','New password (min. 6)')}" required>
      <div class="actions"><button class="btn-light">${tr('Mudar','Change')}</button></div></form>
    <div class="card"><p class="small muted">${esc(me.email)} · ${roleName(me.role)}</p><button class="btn-red" onclick="sb.auth.signOut()">${tr('Sair','Sign out')}</button></div>
    <p class="small muted" style="text-align:center">${EMPRESA} — ${SLOGAN()}</p>`);
  $('#nm').onsubmit = async e => { e.preventDefault();
    try { await rpc('update_my_name', { p_name: new FormData(e.target).get('n') }); await loadPeople(); me = people.find(p => p.id === me.id); toast(tr('Nome guardado.','Name saved.')); viewAccount(); }
    catch (err) { toast(friendly(err), true); } };
  $('#pw').onsubmit = async e => { e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: new FormData(e.target).get('p') });
    if (error) return toast(friendly(error), true); toast(tr('Palavra-passe alterada.','Password changed.')); e.target.reset(); };
}

boot();
</script>
