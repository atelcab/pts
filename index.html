<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATELCAB · Gestão de PTs</title>
<meta name="theme-color" content="#1b2559">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M58 4 22 56h24l-8 40 40-56H54z' fill='%23c62828'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--navy:#1b2559;--navy2:#2a3577;--red:#c62828;--bg:#f3f5f9;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
--blue:#2563eb;--amber:#d97706;--purple:#7c3aed;--green:#16a34a;--teal:#0d9488;--gray:#6b7280;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
a{color:var(--blue)}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .wm{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:18px;letter-spacing:.5px}
.brand small{display:block;font-size:11px;opacity:.75;font-family:system-ui,sans-serif;letter-spacing:0;font-weight:400}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{color:#cbd5e1;text-decoration:none;padding:8px 12px;border-radius:8px;white-space:nowrap;font-size:14px}
nav a.on,nav a:hover{background:var(--navy2);color:#fff}
.who{font-size:13px;opacity:.9;white-space:nowrap;cursor:pointer}
main{max-width:1100px;margin:auto;padding:16px}
h1{font-size:21px;margin:4px 0 16px;color:var(--navy)}h2{font-size:17px;margin:0 0 12px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-left:4px solid var(--c,var(--navy));text-decoration:none;color:inherit}
.stat .n{font-size:28px;font-weight:700}.stat .l{color:var(--muted);font-size:13px}
.progress{height:14px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress div{height:100%;background:var(--green)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}td.num,th.num{text-align:center}
.scroll{overflow-x:auto}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 12%,white);white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#ecfeff;color:var(--teal);font-weight:600;margin-left:6px}
.late{color:var(--red);font-weight:600;font-size:12px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
label.chk{display:flex;align-items:center;gap:8px;font-weight:500}label.chk input{width:auto}
input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:150px}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none}
button:disabled{opacity:.5;cursor:wait}
.btn-main{background:var(--red)}.btn-green{background:var(--green)}.btn-red{background:#b91c1c}.btn-teal{background:var(--teal)}
.btn-light{background:#fff;color:var(--navy);border:1px solid #d1d5db}.btn-sm{padding:6px 11px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.list .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.list .item:hover{background:#f9fafb}.list .item:last-child{border-bottom:0}
.item .t{font-weight:600}.item .s{color:var(--muted);font-size:13px;margin-top:2px}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.ev{position:relative;margin-bottom:16px}.ev:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--gray))}
.ev .h{font-size:13px;color:var(--muted)}.ev .h b{color:var(--text)}
.ev .c{background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:6px;white-space:pre-wrap}
.muted{color:var(--muted)}.small{font-size:13px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--navy),#0e1438)}
.login{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:380px}
.login .logo{display:flex;justify-content:center;margin-bottom:6px}
.login .wm{font-family:Georgia,serif;font-weight:700;font-size:24px;color:var(--navy);text-align:center}
.login .sub{text-align:center;color:#4f6bd8;font-size:13px;margin-bottom:8px}
.sep{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;display:none;z-index:99;max-width:90%}
#toast.err{background:var(--red)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}
.files{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.file{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#f9fafb;text-decoration:none;color:var(--navy);font-size:14px;word-break:break-all}
@media (max-width:640px){.bar{flex-wrap:wrap}nav{order:3;flex-basis:100%}.who{margin-left:auto}.hide-m{display:none}.brand small{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
// ================= Marca ATELCAB =================
function logo(size = 40, light = false) {
  const blue = light ? '#ffffff' : '#1b2559';
  const arc = y => `<path d="M30 ${y}h-14a7 7 0 0 0 0 14h14" fill="none" stroke="${blue}" stroke-width="3.2" stroke-linecap="round"/>
                    <path d="M30 ${y}h14a7 7 0 0 1 0 14h-14" fill="none" stroke="${blue}" stroke-width="3.2" stroke-linecap="round"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 80 64" aria-label="ATELCAB">
    <path d="M30 6v52" stroke="${blue}" stroke-width="3.2"/>${arc(6)}${arc(22)}${arc(38)}
    <path d="M68 4 56 30h9l-6 26 17-32h-9l7-20z" fill="#c62828"/></svg>`;
}
const EMPRESA = 'ATELCAB, LDA.', SLOGAN = 'Construções e Projectos Eléctricos';

// ================= Utilitários =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => d ? new Date(d.length === 10 ? d + 'T00:00:00' : d).toLocaleDateString(LOC()) : '—';
const fmtDT = d => d ? new Date(d).toLocaleString(LOC(), {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const LOC = () => (typeof me !== 'undefined' && me?.role === 'cliente') ? 'en-GB' : 'pt-PT';
const today = () => new Date().toISOString().slice(0, 10);
const safeName = n => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_');
function toast(msg, err = false) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 6000 : 3000);
}
const friendly = e => { const m = e?.message || String(e);
  if (/Invalid login/i.test(m)) return 'Email ou palavra-passe incorrectos · Wrong email or password.';
  if (typeof me !== 'undefined' && me?.role === 'cliente') {
    if (/aguardar a sua resposta/.test(m)) return 'This drawing is not awaiting your response.';
    if (/Descreva as altera/.test(m)) return 'Please describe the changes you need.';
    if (/Coment[aá]rio vazio/.test(m)) return 'The comment is empty.';
    if (/Sem acesso/.test(m)) return 'You do not have access to this drawing.';
    if (/mais de 50 MB/.test(m)) return 'One of the files is larger than 50 MB.';
    return 'Something went wrong. Please try again. (' + m + ')';
  }
  return m; };

const STATUS = {
  pendente:{l:'Por atribuir',c:'var(--gray)'}, atribuido:{l:'Atribuído',c:'var(--blue)'},
  em_progresso:{l:'Em progresso',c:'var(--amber)'}, submetido:{l:'Aguarda revisão',c:'var(--purple)'},
  devolvido:{l:'Devolvido',c:'var(--red)'}, aprovado:{l:'Aprovado · por enviar',c:'var(--green)'},
  enviado_cliente:{l:'Enviado ao cliente',c:'var(--teal)'}, aceite_cliente:{l:'Aceite pelo cliente',c:'var(--green)'},
  alteracoes_cliente:{l:'Cliente pediu alterações',c:'var(--red)'},
};
// O que o cliente vê
const CSTATUS = { enviado_cliente:{l:'To review',c:'var(--teal)'}, aceite_cliente:{l:'Accepted',c:'var(--green)'},
  alteracoes_cliente:{l:'Changes requested',c:'var(--red)'} };
const DONE = ['aprovado','enviado_cliente','aceite_cliente'];
const badge = s => { const x = (isCliente() && (CSTATUS[s] || {l:'Being revised by ATELCAB',c:'var(--amber)'})) || STATUS[s] || {l:s,c:'var(--gray)'};
  return `<span class="badge" style="--c:${x.c}">${x.l}</span>`; };
const isLate = t => t.due_date && !DONE.includes(t.status) && t.due_date < today();
const EVENTS = { criado:'criou a tarefa', atribuido:'atribuiu a tarefa', iniciado:'começou a trabalhar', submetido:'submeteu o trabalho',
  aprovado:'aprovou ✔', devolvido:'devolveu para correcção', comentario:'comentou', enviado_cliente:'enviou ao cliente 📨',
  cliente_aceite:'ACEITOU o drawing ✔', cliente_alteracoes:'pediu alterações', ficheiros:'juntou ficheiros 📎' };
const EVENTS_EN = { enviado_cliente:'sent the drawing for your review 📨', cliente_aceite:'ACCEPTED the drawing ✔',
  cliente_alteracoes:'requested changes', comentario:'commented' };
const EVCOLOR = { criado:'var(--gray)', atribuido:'var(--blue)', iniciado:'var(--amber)', submetido:'var(--purple)', aprovado:'var(--green)',
  devolvido:'var(--red)', comentario:'var(--navy)', enviado_cliente:'var(--teal)', cliente_aceite:'var(--green)', cliente_alteracoes:'var(--red)', ficheiros:'var(--blue)' };

// ================= Estado =================
let sb, me = null, people = [];
const isAdmin = () => me?.role === 'admin', isCliente = () => me?.role === 'cliente';
const nameOf = id => { const p = people.find(x => x.id === id); return p ? (p.full_name || p.email) : '—'; };
const techs = () => people.filter(p => p.role === 'tecnico').concat(people.filter(p => p.role === 'admin'));
const ROLE = { admin:'Administrador', tecnico:'Técnico', cliente:'Cliente' };
const tr = (pt, en) => isCliente() ? en : pt;

// ================= Arranque =================
async function boot() {
  if (typeof SUPABASE_URL === 'undefined' || !/^https:\/\//.test(SUPABASE_URL) || !SUPABASE_KEY || SUPABASE_KEY.includes('COLE')) {
    $('#root').innerHTML = `<div class="center"><div class="login"><div class="logo">${logo(70)}</div><div class="wm">ATELCAB</div>
      <p class="muted">Falta configurar: crie o ficheiro <b>config.js</b> com o Project URL e a chave do Supabase.</p></div></div>`;
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange(ev => {
    if (ev === 'PASSWORD_RECOVERY') renderNewPassword();
    if (ev === 'SIGNED_OUT') { me = null; renderLogin(); }
  });
  const { data } = await sb.auth.getSession();
  if (location.hash.includes('type=recovery')) return;
  if (data.session) await enter(); else renderLogin();
}
async function enter() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return renderLogin();
  await loadPeople();
  me = people.find(p => p.id === user.id);
  if (!me) { toast('Perfil não encontrado. Contacte a ATELCAB.', true); await sb.auth.signOut(); return; }
  window.onhashchange = route;
  if (!location.hash || location.hash === '#' || location.hash.startsWith('#access_token')) location.hash = '#/painel'; else route();
}
async function loadPeople() {
  const { data, error } = await sb.from('profiles').select('*').order('full_name');
  if (error) throw error; people = data;
}
function loginBox(inner) {
  return `<div class="center"><form class="login" id="f"><div class="logo">${logo(76)}</div>
    <div class="wm">${EMPRESA}</div><div class="sub">${SLOGAN}</div>${inner}</form></div>`;
}
function renderLogin() {
  window.onhashchange = null;
  $('#root').innerHTML = loginBox(`<p class="muted small" style="text-align:center;margin:0">Plataforma de Gestão de Projectos · Project Portal</p>
    <label>Email</label><input type="email" name="email" required autocomplete="email">
    <label>Palavra-passe · Password</label><input type="password" name="pw" required autocomplete="current-password">
    <div class="actions"><button class="btn-main" style="width:100%">Entrar · Sign in</button></div>
    <p class="small" style="text-align:center"><a href="#" id="forgot">Esqueci a palavra-passe · Forgot password</a></p>`);
  $('#f').onsubmit = async e => {
    e.preventDefault(); const b = e.submitter; b.disabled = true; const f = new FormData(e.target);
    const { error } = await sb.auth.signInWithPassword({ email: f.get('email').trim(), password: f.get('pw') });
    b.disabled = false; if (error) return toast(friendly(error), true);
    location.hash = '#/painel'; enter();
  };
  $('#forgot').onclick = async e => {
    e.preventDefault(); const email = $('#f [name=email]').value.trim();
    if (!email) return toast('Escreva primeiro o seu email · Please type your email first.', true);
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) return toast(friendly(error), true);
    toast('Enviámos um email com o link · We sent you an email with a reset link.');
  };
}
function renderNewPassword() {
  $('#root').innerHTML = loginBox(`<h2 style="text-align:center">Nova palavra-passe · New password</h2>
    <input type="password" name="pw" minlength="6" placeholder="Mín. 6 · Min. 6 characters" required>
    <div class="actions"><button class="btn-main" style="width:100%">Guardar · Save</button></div>`);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: new FormData(e.target).get('pw') });
    if (error) return toast(friendly(error), true);
    toast('Palavra-passe alterada · Password changed.'); history.replaceState(null, '', location.pathname + '#/painel'); enter();
  };
}

// ================= Layout =================
function shell(active, html) {
  const links = [['painel', tr('📊 Painel','📊 Dashboard')], ['tarefas', isCliente() ? '📄 Drawings' : isAdmin() ? '📋 Tarefas' : '📋 As minhas tarefas']];
  if (isAdmin()) links.push(['nova','➕ Nova tarefa'], ['equipa','👥 Equipa']);
  $('#root').innerHTML = `<header><div class="bar">
    <a class="brand" href="#/painel" style="color:#fff;text-decoration:none">${logo(34, true)}<div><span class="wm">ATELCAB</span><small>${tr('Gestão de PTs','Project Portal')}</small></div></a>
    <nav>${links.map(([k,l]) => `<a href="#/${k}" class="${active===k?'on':''}">${l}</a>`).join('')}</nav>
    <div class="who" onclick="location.hash='#/conta'">👤 ${esc(me.full_name || me.email)}${isAdmin() ? ' · admin' : isCliente() ? ' · client' : ''}</div>
  </div></header><main>${html}</main>`;
}
async function route() {
  const [, page, id] = location.hash.split('?')[0].split('/');
  try {
    if (page === 'tarefa' && id) return await viewTask(+id);
    if (page === 'tarefas') return await viewTasks();
    if (page === 'nova' && isAdmin()) return viewNew();
    if (page === 'equipa' && isAdmin()) return await viewTeam();
    if (page === 'conta') return viewAccount();
    return await viewDashboard();
  } catch (e) { console.error(e); toast(friendly(e), true); }
}
const FASES = { fase1:'1ª Fase', fase2:'2ª Fase', reabilitacao:'Reabilitação' };
const FCOL = { fase1:'#2563eb', fase2:'#7c3aed', reabilitacao:'#d97706' };
const FASES_EN = { fase1:'Phase 1', fase2:'Phase 2', reabilitacao:'Rehabilitation' };
const faseName = f => f ? (isCliente() ? FASES_EN[f] : FASES[f]) : tr('Sem fase', 'Other');
const faseBadge = f => f ? `<span class="badge" style="--c:${FCOL[f]}">${faseName(f)}</span>` : '';
const faseSelect = (name, val, empty = '— sem fase —') => `<select name="${name}"><option value="">${empty}</option>${Object.entries(FASES).map(([k,v]) => `<option value="${k}" ${val===k?'selected':''}>${v}</option>`).join('')}</select>`;

async function fetchTasks() {
  const { data, error } = await sb.from('tasks')
    .select('id,code,title,status,fase,assigned_to,due_date,created_at,updated_at,approved_at,sent_to_client_at')
    .order('updated_at', { ascending: false });
  if (error) throw error; return data;
}
const stat = (n, l, col, s) => `<a class="stat" style="--c:${col}" href="#/tarefas${s ? '?s=' + s : ''}"><div class="n">${n}</div><div class="l">${l}</div></a>`;
function itemHTML(t) {
  return `<a class="item" href="#/tarefa/${t.id}"><div><div class="t">${esc(t.code)}${t.title ? ' — ' + esc(t.title) : ''}</div>
    <div class="s">${!isCliente() && t.fase ? FASES[t.fase] + ' · ' : ''}${!isCliente() && t.assigned_to ? '👤 ' + esc(nameOf(t.assigned_to)) + ' · ' : ''}${!isCliente() && t.due_date ? 'Prazo ' + fmtDate(t.due_date) + ' · ' : ''}${isCliente() ? 'Sent ' + fmtDT(t.sent_to_client_at) : 'act. ' + fmtDT(t.updated_at)}
    ${!isCliente() && isLate(t) ? ' <span class="late">· ATRASADO</span>' : ''}</div></div>${badge(t.status)}</a>`;
}
const section = (title, list) => list.length ? `<div class="card"><h2>${title}</h2><div class="list">${list.map(itemHTML).join('')}</div></div>` : '';

// Contagens por fase (usadas no painel e no Excel)
function phaseRows(tasks) {
  const groups = [...Object.keys(FASES), null];
  return groups.map(f => {
    const l = tasks.filter(t => (t.fase || null) === f), k = s => l.filter(t => s.includes(t.status)).length;
    return { f, nome: f ? FASES[f] : 'Sem fase', total: l.length, feitos: k(DONE), curso: k(['atribuido','em_progresso']), rev: k(['submetido']),
      dev: k(['devolvido','alteracoes_cliente']), pend: k(['pendente']), cli: k(['enviado_cliente']), aceites: k(['aceite_cliente']), late: l.filter(isLate).length };
  }).filter(r => r.f || r.total);
}

// ================= Painel / relatórios =================
async function viewDashboard() {
  shell('painel', `<p class="muted">${tr('A carregar…','Loading…')}</p>`);
  const tasks = await fetchTasks();
  const c = s => tasks.filter(t => s.includes(t.status)).length;

  if (isCliente()) return clientDashboard(tasks);

  const total = tasks.length, done = c(DONE), pct = total ? Math.round(done / total * 100) : 0;
  const late = tasks.filter(isLate).length;
  const doneWeek = tasks.filter(t => DONE.includes(t.status) && t.approved_at && new Date(t.approved_at) > Date.now() - 7 * 864e5).length;

  const phases = phaseRows(tasks);
  const perPhase = `<div class="card"><h2>📊 Por fase</h2>
    ${phases.map(r => { const p = r.total ? Math.round(r.feitos / r.total * 100) : 0;
      return `<div style="margin:10px 0 14px"><div class="row" style="align-items:center;gap:6px">
        <div><a href="#/tarefas?f=${r.f || 'none'}" style="text-decoration:none"><b style="color:${FCOL[r.f] || 'var(--gray)'}">${r.nome}</b></a></div>
        <div style="flex:0;white-space:nowrap"><b>${r.feitos}</b> de <b>${r.total}</b> feitos · <b style="color:var(--green)">${p}%</b></div></div>
        <div class="progress" style="margin-top:6px;height:10px"><div style="width:${p}%;background:${FCOL[r.f] || 'var(--gray)'}"></div></div></div>`; }).join('')}
    <div class="scroll"><table>
      <tr><th>Fase</th><th class="num">Total</th><th class="num">Feitos</th><th class="num">Em curso</th><th class="num">Aguarda revisão</th><th class="num">Devolvidos</th><th class="num">Por atribuir</th><th class="num">Com cliente</th><th class="num">Aceites cliente</th><th class="num">Atrasados</th></tr>
      ${phases.map(r => `<tr><td><b style="color:${FCOL[r.f] || 'var(--gray)'}">${r.nome}</b></td><td class="num">${r.total}</td><td class="num"><b style="color:var(--green)">${r.feitos}</b></td>
        <td class="num">${r.curso}</td><td class="num">${r.rev}</td><td class="num">${r.dev}</td><td class="num">${r.pend}</td><td class="num">${r.cli}</td><td class="num">${r.aceites}</td>
        <td class="num">${r.late ? `<span class="late">${r.late}</span>` : 0}</td></tr>`).join('')}

async function exportCSV() {
  const tasks = await fetchTasks();
  const order = { fase1: 1, fase2: 2, reabilitacao: 3 };
  tasks.sort((a, b) => (order[a.fase] || 9) - (order[b.fase] || 9) || a.code.localeCompare(b.code, 'pt', { numeric: true }));
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [[`ATELCAB — Relatório de PTs — ${fmtDT(new Date().toISOString())}`], [],
    ['RESUMO POR FASE'], ['Fase','Total','Feitos (aprovados)','% feitos','Em curso','Aguarda revisão','Devolvidos','Por atribuir','Com cliente','Aceites pelo cliente','Atrasados']];
  const ph = phaseRows(tasks);
  ph.forEach(r => lines.push([r.nome, r.total, r.feitos, r.total ? Math.round(r.feitos / r.total * 100) + '%' : '0%', r.curso, r.rev, r.dev, r.pend, r.cli, r.aceites, r.late]));
  const sum = k => ph.reduce((s, r) => s + r[k], 0), tot = sum('total');
  lines.push(['TOTAL', tot, sum('feitos'), tot ? Math.round(sum('feitos') / tot * 100) + '%' : '0%', sum('curso'), sum('rev'), sum('dev'), sum('pend'), sum('cli'), sum('aceites'), sum('late')]);
  lines.push([], ['DETALHE'], ['Fase','Código','Título','Estado','Técnico','Prazo','Atrasado','Criado em','Última actualização','Aprovado em','Enviado ao cliente']);
  tasks.forEach(t => lines.push([t.fase ? FASES[t.fase] : 'Sem fase', t.code, t.title, STATUS[t.status].l, t.assigned_to ? nameOf(t.assigned_to) : '',
    t.due_date ? fmtDate(t.due_date) : '', isLate(t) ? 'Sim' : '', fmtDT(t.created_at), fmtDT(t.updated_at), t.approved_at ? fmtDT(t.approved_at) : '', t.sent_to_client_at ? fmtDT(t.sent_to_client_at) : '']));
  const csv = '﻿' + lines.map(r => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `ATELCAB-relatorio-PTs-${today()}.csv`; a.click();
}

const ACCEPT = '.pdf,.xls,.xlsx,.xlsm,.csv,.doc,.docx,.dwg,.dxf,.kmz,.kml,.zip,image/*';
const icon = n => /\.pdf$/i.test(n) ? '📄' : /\.(xlsx?|xlsm|csv)$/i.test(n) ? '📊' : /\.(jpe?g|png|gif|webp|heic)$/i.test(n) ? '🖼️' : /\.(docx?)$/i.test(n) ? '📝' : /\.(dwg|dxf)$/i.test(n) ? '📐' : '📎';
const actFiles = a => a?.files?.length ? a.files : a?.file_path ? [{ path: a.file_path, name: a.file_name }] : [];
async function openFile(path, name) {
  const w = window.open('', '_blank');
  const inline = /\.(pdf|jpe?g|png|gif|webp)$/i.test(name || path);
  const { data, error } = await sb.storage.from('drawings').createSignedUrl(path, 3600, inline ? undefined : { download: name || true });
  if (error) { w?.close(); return toast(friendly(error), true); }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}
function filesHTML(list, title) {
  if (!list?.length) return '';
  return `<div class="files">${title ? `<div class="small muted" style="margin-bottom:4px">${title}</div>` : ''}${list.map(f =>
    `<a href="#" class="file" onclick="openFile('${esc(f.path)}','${esc(f.name || '')}');return false">${icon(f.name || f.path)} ${esc(f.name || 'file')}</a>`).join('')}</div>`;
}
async function uploadFiles(fileList, folder, prog) {
  const files = [...(fileList || [])].filter(f => f && f.size);
  const out = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (f.size > 50 * 1024 * 1024) throw new Error(`"${f.name}" tem mais de 50 MB.`);
    const msg = tr(`A carregar ${i + 1} de ${files.length}: ${f.name}…`, `Uploading ${i + 1} of ${files.length}: ${f.name}…`); if (prog) prog.textContent = msg; else toast(msg);
    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}-${safeName(f.name)}`;
    const { error } = await sb.storage.from('drawings').upload(path, f, { contentType: f.type || 'application/octet-stream' });
    if (error) throw error;
    out.push({ path, name: f.name });
  }
  if (prog) prog.textContent = '';
  return out;
}

        <div>Prazo</div><div>${fmtDate(t.due_date)}</div>
        <div>Criado</div><div>${fmtDT(t.created_at)} por ${esc(nameOf(t.created_by))}</div>
        ${t.approved_at ? `<div>Aprovado</div><div>${fmtDT(t.approved_at)} por ${esc(nameOf(t.approved_by))}</div>` : ''}
        ${t.sent_to_client_at ? `<div>Ao cliente</div><div>${fmtDT(t.sent_to_client_at)}</div>` : ''}</div>
        ${t.description ? `<p style="white-space:pre-wrap;background:#f9fafb;padding:10px;border-radius:8px">${esc(t.description)}</p>` : ''}`}
      ${filesBlock}
      <div class="actions">${actions}</div>${forms}
    </div>
    ${isAdmin() && !DONE.includes(t.status) ? `<div class="card"><h2>${t.status === 'alteracoes_cliente' ? 'Atribuir correcções do cliente' : 'Atribuir'}</h2><div class="row">
      <div><select id="asg"><option value="">— escolher técnico —</option>
        ${techs().map(p => `<option value="${p.id}" ${p.id === t.assigned_to ? 'selected' : ''}>${esc(p.full_name || p.email)}${p.role==='admin'?' (admin)':''}</option>`).join('')}</select></div>
      <div style="flex:0"><button onclick="assign(${id})">${t.assigned_to ? 'Reatribuir' : 'Atribuir'} e notificar</button></div></div></div>` : ''}
    <div class="card"><h2>${isCliente() ? 'Comments' : 'Histórico e comentários'}</h2><div class="timeline">${tl}</div>
      <form id="cbox"><label>${tr('Novo comentário','New comment')}</label><textarea name="c" required style="min-height:60px"></textarea>
        ${isAdmin() && t.sent_to_client_at ? '<label class="chk"><input type="checkbox" name="cli"> Enviar também ao cliente (ele vê e recebe email)</label>' : ''}
        <div class="actions"><button class="btn-light">💬 ${tr('Comentar','Send comment')}</button></div></form></div>
    ${isAdmin() ? `<div class="card"><h2>Editar tarefa</h2><form id="edit">
      <div class="row"><div><label>Código</label><input name="code" value="${esc(t.code)}" required></div>
        <div><label>Título</label><input name="title" value="${esc(t.title || '')}"></div></div>
      <div class="row"><div><label>Fase</label>${faseSelect('fase', t.fase)}</div>
        <div><label>Prazo</label><input type="date" name="due" value="${t.due_date || ''}"></div></div>
      <label>Descrição (interna)</label><textarea name="desc">${esc(t.description || '')}</textarea>
      <div class="actions"><button class="btn-light">Guardar</button>
        <button type="button" class="btn-red btn-sm" style="margin-left:auto" onclick="delTask(${id})">🗑 Eliminar</button></div></form></div>` : ''}`);

  const on = (sel, fn) => { const f = $(sel); if (f) f.onsubmit = async e => {
    e.preventDefault(); const b = e.submitter; b.disabled = true;
    try { await fn(e.target, new FormData(e.target)); route(); } catch (err) { toast(friendly(err), true); b.disabled = false; } }; };
  const up = (f, folder) => uploadFiles(f.querySelector('input[type=file]')?.files, folder, f.querySelector('[data-prog]'));
  on('#subbox', async (f, d) => { const files = await up(f, `submissoes/${id}`);
    await rpc('submit_task', { p_task: id, p_comment: d.get('c'), p_files: files }); toast(`Submetido com ${files.length} ficheiro(s). Os administradores foram notificados.`); });
  on('#retbox', async (f, d) => { await rpc('return_task', { p_task: id, p_comment: d.get('c') }); toast('Devolvido ao técnico.'); });
  on('#sendbox', async (f, d) => { const files = await up(f, `cliente-envios/${id}`);
    await rpc('send_to_client', { p_task: id, p_message: d.get('c'), p_files: files }); toast('📨 Enviado ao cliente.'); });
  on('#addbox', async (f, d) => { const files = await up(f, `originais/${id}`);
    if (!files.length) throw new Error('Escolha pelo menos um ficheiro.');
    await rpc('add_task_files', { p_task: id, p_files: files, p_comment: d.get('c') }); toast(`${files.length} ficheiro(s) juntos.`); });
  on('#altbox', async (f, d) => { const files = await up(f, `cliente/${id}`);
    await rpc('client_respond', { p_task: id, p_accept: false, p_comment: d.get('c'), p_files: files }); toast('Your change request was sent to ATELCAB.'); });
  on('#cbox', async (f, d) => { await rpc('add_comment', { p_task: id, p_comment: d.get('c'), p_to_client: !!d.get('cli') }); });
  on('#edit', async (f, d) => {
    const { error } = await sb.from('tasks').update({ code: d.get('code').trim(), title: d.get('title').trim() || null, fase: d.get('fase') || null,
      due_date: d.get('due') || null, description: d.get('desc').trim() || null, updated_at: new Date().toISOString() }).eq('id', id);
    if (error) throw error; toast('Guardado.'); });
}
async function rpc(fn, args) { const { error } = await sb.rpc(fn, args); if (error) throw error; }
async function act(fn, args) { try { await rpc(fn, args); route(); } catch (e) { toast(friendly(e), true); } }
async function approve(id) {
  const c = prompt('Aprovar este PT. Comentário (opcional):', ''); if (c === null) return;
  try { await rpc('approve_task', { p_task: id, p_comment: c }); toast('✔ Aprovado e contabilizado.'); route(); } catch (e) { toast(friendly(e), true); }
}
async function clientAccept(id) {
  const c = prompt('Accept this drawing. Comment (optional):', ''); if (c === null) return;
  try { await rpc('client_respond', { p_task: id, p_accept: true, p_comment: c, p_files: [] }); toast('✔ Thank you! Drawing accepted.'); route(); }
  catch (e) { toast(friendly(e), true); }
}
async function assign(id) {
  const u = $('#asg').value; if (!u) return toast('Escolha um técnico.', true);
  try { await rpc('assign_task', { p_task: id, p_user: u }); toast('Atribuído. O técnico recebeu um email.'); route(); } catch (e) { toast(friendly(e), true); }
}
async function delTask(id) {
  if (!confirm('Eliminar esta tarefa e todo o histórico? Não pode ser desfeito.')) return;
  const { error } = await sb.from('tasks').delete().eq('id', id);
  if (error) return toast(friendly(error), true);
  toast('Tarefa eliminada.'); location.hash = '#/tarefas';
}

// ================= Nova tarefa =================
function viewNew() {
  shell('nova', `<h1>Nova tarefa</h1><form class="card" id="nf">
    <div class="row"><div><label>Código do PT *</label><input name="code" placeholder="ex.: PT 12"></div>
      <div><label>Fase</label>${faseSelect('fase', '')}</div></div>
    <label>Título</label><input name="title" placeholder="ex.: Revisão do esquema unifilar">
    ${fileInput('Ficheiros para o técnico', 'Drawings PDF, Excel, fotos… Pode escolher vários de uma vez — ficam todos nesta tarefa.')}
    <label class="chk"><input type="checkbox" name="split"> Criar <b>uma tarefa por ficheiro</b> (o nome do ficheiro passa a ser o código do PT)</label>
    <label>Instruções para o técnico</label><textarea name="desc" placeholder="O que deve ser feito…"></textarea>
    <div class="row"><div><label>Atribuir a</label><select name="who"><option value="">— atribuir depois —</option>
        ${techs().map(p => `<option value="${p.id}">${esc(p.full_name || p.email)}${p.role==='admin'?' (admin)':''}</option>`).join('')}</select></div>
      <div><label>Prazo</label><input type="date" name="due"></div></div>
    <div class="actions"><button class="btn-main">Criar tarefa</button></div><p class="small muted" id="prog"></p></form>`);
  $('#nf').onsubmit = async e => {
    e.preventDefault(); const b = e.submitter; b.disabled = true; const f = new FormData(e.target);
    const picked = [...e.target.querySelector('input[type=file]').files].filter(x => x.size), code = f.get('code').trim(), split = !!f.get('split');
    if (!split && !code) { b.disabled = false; return toast('Indique o código do PT.', true); }
    if (split && !picked.length) { b.disabled = false; return toast('Escolha os ficheiros (um por tarefa).', true); }
    const base = { p_title: f.get('title').trim(), p_description: f.get('desc').trim(), p_due: f.get('due') || null, p_assign: f.get('who') || null, p_fase: f.get('fase') || null };
    try {
      let lastId, n = 0;
      if (split) {
        for (const file of picked) {
          const files = await uploadFiles([file], 'originais', $('#prog'));
          const { data, error } = await sb.rpc('create_task', { ...base, p_code: file.name.replace(/\.[^.]+$/, ''), p_files: files });
          if (error) throw error; lastId = data; n++;
        }
      } else {
        const files = await uploadFiles(picked, 'originais', $('#prog'));
        const { data, error } = await sb.rpc('create_task', { ...base, p_code: code, p_files: files });
        if (error) throw error; lastId = data; n = 1;
      }
      toast(`${n} tarefa(s) criada(s)${base.p_assign ? ' e técnico notificado' : ''}.`);
      location.hash = n === 1 ? `#/tarefa/${lastId}` : '#/tarefas';
    } catch (err) { toast(friendly(err), true); b.disabled = false; $('#prog').textContent = ''; }
  };
}

// ================= Equipa =================
async function viewTeam() {
  await loadPeople();
  shell('equipa', `<h1>Equipa e clientes</h1>
    <div class="card"><div class="scroll"><table><tr><th>Nome</th><th class="hide-m">Email</th><th>Função</th><th></th></tr>
    ${people.map(p => `<tr><td><input value="${esc(p.full_name || '')}" id="n-${p.id}"></td><td class="hide-m small">${esc(p.email)}</td>
      <td><select id="r-${p.id}" ${p.id === me.id ? 'disabled' : ''}>${Object.entries(ROLE).map(([k,v]) => `<option value="${k}" ${p.role===k?'selected':''}>${v}</option>`).join('')}</select></td>
      <td><button class="btn-sm btn-light" onclick="saveMember('${p.id}')">Guardar</button></td></tr>`).join('')}
    </table></div></div>
    <div class="card small"><h2>Adicionar técnico ou cliente</h2><ol style="padding-left:18px;margin:0">
      <li>supabase.com › projecto › <b>Authentication</b> › <b>Users</b> › <b>Add user</b> › <b>Create new user</b>.</li>
      <li>Email + palavra-passe provisória, marque <b>Auto Confirm User</b>.</li>
      <li>Volte aqui: aparece como Técnico. Para cliente, mude a função para <b>Cliente</b>. Corrija o nome e Guardar.</li>
      <li>Envie-lhe o link da plataforma, o email e a palavra-passe.</li></ol>
      <p class="muted">O cliente só vê os drawings que lhe envia, a versão final e os comentários marcados “👁 cliente”.</p></div>`);
}
async function saveMember(id) {
  const { error } = await sb.from('profiles').update({ full_name: $('#n-' + id).value.trim() || null, role: $('#r-' + id).value }).eq('id', id);
  if (error) return toast(friendly(error), true);
  await loadPeople(); toast('Guardado.');
}

// ================= Conta =================
function viewAccount() {
  shell('conta', `<h1>${tr('A minha conta','My account')}</h1>
    <form class="card" id="nm"><h2>${tr('Nome','Name')}</h2><input name="n" value="${esc(me.full_name || '')}" required><div class="actions"><button class="btn-light">${tr('Guardar nome','Save name')}</button></div></form>
    <form class="card" id="pw"><h2>${tr('Mudar palavra-passe','Change password')}</h2><input type="password" name="p" minlength="6" placeholder="${tr('Nova palavra-passe (mín. 6)','New password (min. 6)')}" required>
      <div class="actions"><button class="btn-light">${tr('Mudar','Change')}</button></div></form>
    <div class="card"><p class="small muted">${esc(me.email)} · ${tr(ROLE[me.role], 'Client')}</p><button class="btn-red" onclick="sb.auth.signOut()">${tr('Sair','Sign out')}</button></div>
    <p class="small muted" style="text-align:center">${EMPRESA} — ${tr(SLOGAN, 'Electrical Construction &amp; Engineering')}</p>`);
  $('#nm').onsubmit = async e => { e.preventDefault();
    try { await rpc('update_my_name', { p_name: new FormData(e.target).get('n') }); await loadPeople(); me = people.find(p => p.id === me.id); toast(tr('Nome guardado.','Name saved.')); viewAccount(); }
    catch (err) { toast(friendly(err), true); } };
  $('#pw').onsubmit = async e => { e.preventDefault();
    const { error } = await sb.auth.updateUser({ password: new FormData(e.target).get('p') });
    if (error) return toast(friendly(error), true); toast(tr('Palavra-passe alterada.','Password changed.')); e.target.reset(); };
}

boot();
</script>
